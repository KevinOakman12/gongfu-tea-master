<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#121311">
<title>Gongfu Tea Master</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23161514'/%3E%3Ctext x='32' y='44' font-size='34' text-anchor='middle' fill='%23C87D55'%3E%E8%8C%B6%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Serif+SC:wght@500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          peat: '#121311',
          stone: '#1E1D1B',
          ink: '#E6E2D8',
          sage: '#9A968C'
        },
        fontFamily: {
          serif: ['"Cormorant Garamond"', '"Noto Serif SC"', 'Georgia', 'serif'],
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace']
        }
      }
    }
  };
</script>
<style>
  :root {
    --bg: #121311;
    --bg-2: #161514;
    --surface: #1E1D1B;
    --glass: rgba(30, 29, 27, 0.72);
    --line: rgba(255, 255, 255, 0.07);
    --line-2: rgba(255, 255, 255, 0.12);
    --text: #E6E2D8;
    --muted: #9A968C;
    --accent: #C87D55;
    --warn: #D9A752;
    --timer-size: min(70vw, 36vh, 320px);
  }
  @media (min-width: 640px) { :root { --timer-size: min(56vw, 42vh, 340px); } }

  * { -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1100px 560px at 8% -12%, rgba(200, 125, 85, 0.09), transparent 60%),
      radial-gradient(900px 520px at 110% 8%, rgba(107, 158, 136, 0.06), transparent 60%),
      radial-gradient(800px 600px at 50% 120%, rgba(217, 167, 82, 0.05), transparent 60%),
      linear-gradient(180deg, var(--bg-2), var(--bg));
  }
  [hidden] { display: none !important; }
  ::selection { background: rgba(200, 125, 85, 0.35); }

  .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, serif; }
  .hz { font-family: 'Noto Serif SC', 'Cormorant Garamond', serif; letter-spacing: 0.04em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  .tnum { font-variant-numeric: tabular-nums; }
  .accent { color: var(--accent); }
  .ico { width: 1em; height: 1em; flex-shrink: 0; }

  .glass {
    background: var(--glass);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--line);
  }

  /* ── Header tabs ── */
  .tab {
    position: relative;
    padding: 0.5rem 0.85rem;
    border-radius: 999px;
    color: var(--muted);
    font-size: 0.875rem;
    transition: color .3s, background .3s;
    display: inline-flex; align-items: center; gap: .4rem;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text); }
  .tab[aria-selected="true"] { color: var(--text); background: rgba(255, 255, 255, 0.06); }
  .tab .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .tab .live-dot.pulse { animation: pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.5rem; height: 2.5rem; border-radius: 999px;
    color: var(--muted); border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.02);
    transition: color .25s, border-color .25s, background .25s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--line-2); background: rgba(255, 255, 255, 0.05); }
  .icon-btn:disabled { opacity: .3; pointer-events: none; }

  /* ── Pills, chips, badges ── */
  .pill {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .45rem .9rem; border-radius: 999px;
    font-size: .8125rem; color: var(--muted);
    border: 1px solid var(--line);
    background: rgba(255, 255, 255, 0.02);
    white-space: nowrap;
    transition: all .25s ease;
  }
  .pill:hover { color: var(--text); border-color: var(--line-2); }
  .pill[aria-pressed="true"] {
    color: var(--text);
    border-color: color-mix(in srgb, var(--c, #E6E2D8) 45%, transparent);
    background: color-mix(in srgb, var(--c, #E6E2D8) 12%, transparent);
  }
  .pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--muted)); }
  .pill .count { font-family: 'JetBrains Mono', monospace; font-size: .72rem; opacity: .6; }

  .badge {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .2rem .6rem; border-radius: 999px;
    font-size: .72rem; letter-spacing: .02em;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 13%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 26%, transparent);
  }
  .curve-chip {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .2rem .55rem; border-radius: 999px;
    font-size: .72rem; color: var(--muted);
    border: 1px solid var(--line);
  }
  .tag {
    display: inline-block; padding: .3rem .7rem; border-radius: 999px;
    font-size: .8rem; color: var(--text);
    background: rgba(255, 255, 255, 0.04); border: 1px solid var(--line);
  }

  /* ── Segmented control ── */
  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 4px; border-radius: 14px; background: rgba(0, 0, 0, 0.18); border: 1px solid var(--line); }
  .seg button {
    padding: .6rem .5rem; border-radius: 10px; font-size: .85rem; color: var(--muted);
    transition: all .3s ease;
  }
  .seg button[aria-pressed="true"] { color: var(--text); background: rgba(255, 255, 255, 0.07); box-shadow: 0 1px 0 rgba(255, 255, 255, 0.06) inset, 0 6px 16px -10px rgba(0, 0, 0, 0.6); }

  .preset {
    padding: .35rem .7rem; border-radius: 10px; font-size: .8rem;
    font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums;
    color: var(--muted); border: 1px solid var(--line);
    transition: all .25s;
  }
  .preset:hover { color: var(--text); border-color: var(--line-2); }
  .preset[aria-pressed="true"] { color: var(--bg); background: var(--text); border-color: var(--text); }

  /* ── Range ── */
  input[type="range"].range {
    -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; cursor: pointer;
  }
  input[type="range"].range::-webkit-slider-runnable-track {
    height: 4px; border-radius: 4px;
    background: linear-gradient(90deg, #C87D55 0%, #D9A752 var(--pct, 15%), rgba(255, 255, 255, 0.08) var(--pct, 15%));
  }
  input[type="range"].range::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); }
  input[type="range"].range::-moz-range-progress { height: 4px; border-radius: 4px; background: linear-gradient(90deg, #C87D55, #D9A752); }
  input[type="range"].range::-webkit-slider-thumb {
    -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; margin-top: -7px;
    background: var(--text); border: 3px solid var(--surface); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2), 0 4px 12px rgba(0, 0, 0, 0.4);
  }
  input[type="range"].range::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%; background: var(--text); border: 3px solid var(--surface);
  }

  .field {
    background: rgba(0, 0, 0, 0.2); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); outline: none; transition: border-color .25s, background .25s;
  }
  .field:focus { border-color: rgba(200, 125, 85, 0.5); background: rgba(0, 0, 0, 0.28); }
  .field::placeholder { color: rgba(154, 150, 140, 0.7); }
  input[type="number"].field::-webkit-inner-spin-button, input[type="number"].field::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"].field { -moz-appearance: textfield; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }

  /* ── Tea cards ── */
  .tea-card {
    position: relative; text-align: left; display: flex; flex-direction: column;
    padding: 1rem 1.05rem; border-radius: 18px; min-height: 172px;
    transition: transform .35s cubic-bezier(.2, .8, .2, 1), border-color .35s, box-shadow .35s, background .35s;
    overflow: hidden;
  }
  .tea-card::after {
    content: ''; position: absolute; left: 0; top: 18px; bottom: 18px; width: 2px; border-radius: 2px;
    background: var(--c); opacity: .55; transition: opacity .3s;
  }
  .tea-card:hover { transform: translateY(-2px); border-color: color-mix(in srgb, var(--c) 35%, transparent); }
  .tea-card.selected {
    border-color: color-mix(in srgb, var(--c) 65%, transparent);
    background: color-mix(in srgb, var(--c) 7%, rgba(30, 29, 27, 0.8));
    box-shadow: 0 14px 34px -18px color-mix(in srgb, var(--c) 70%, transparent);
  }
  .tea-card.selected::after { opacity: 1; }
  .card-in { animation: cardIn .45s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

  /* ── Detail panel / mobile drawer ── */
  #detail { border-radius: 22px; }
  @media (max-width: 1023px) {
    #detail {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
      border-radius: 24px 24px 0 0;
      background: rgba(28, 27, 25, 0.96);
      transform: translateY(105%);
      transition: transform .5s cubic-bezier(.2, .8, .2, 1);
      padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
    }
    #detail.open { transform: none; }
  }
  @media (min-width: 1024px) {
    #detail { position: sticky; top: 88px; max-height: calc(100vh - 110px); overflow-y: auto; }
  }
  .sheet-handle { width: 42px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, 0.15); margin: -0.25rem auto 0.9rem; }
  .backdrop {
    position: fixed; inset: 0; z-index: 55; background: rgba(12, 12, 11, 0.62);
    backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
    opacity: 0; pointer-events: none; transition: opacity .4s;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .dose {
    border-radius: 18px; padding: 1rem 1.1rem;
    background: linear-gradient(135deg, color-mix(in srgb, var(--c) 14%, transparent), rgba(255, 255, 255, 0.015));
    border: 1px solid color-mix(in srgb, var(--c) 22%, transparent);
  }
  .stat { padding: .6rem .7rem; border-radius: 12px; background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line); }
  .stat .k { font-size: .68rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
  .stat .v { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; font-size: .95rem; margin-top: .15rem; }

  .plaque {
    display: flex; gap: .6rem; align-items: flex-start;
    padding: .7rem .9rem; border-radius: 14px; font-size: .85rem; line-height: 1.4;
  }
  .plaque.lid { color: #CFE3D9; background: rgba(107, 158, 136, 0.1); border: 1px solid rgba(107, 158, 136, 0.28); }
  .plaque.warn { color: #F0D9A8; background: rgba(217, 167, 82, 0.09); border: 1px solid rgba(217, 167, 82, 0.3); }
  .plaque .ico { width: 1.1rem; height: 1.1rem; margin-top: .05rem; }

  .tip {
    position: relative; padding: 1rem 1.1rem 1rem 1.2rem; border-radius: 16px;
    background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line);
  }
  .tip::before { content: '師'; position: absolute; right: .9rem; top: .55rem; font-family: 'Noto Serif SC', serif; font-size: 1.6rem; color: var(--c); opacity: .18; }

  /* ── Curve chart ── */
  .chart { display: flex; align-items: flex-end; gap: 4px; height: 120px; padding-top: 18px; }
  .chart .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart .bar {
    width: 100%; max-width: 26px; border-radius: 6px 6px 3px 3px; position: relative;
    background: linear-gradient(180deg, color-mix(in srgb, var(--c) 85%, white 0%), color-mix(in srgb, var(--c) 35%, transparent));
    transform-origin: bottom; animation: barGrow .7s cubic-bezier(.2, .8, .2, 1) both;
  }
  .chart .bar.dip { background: linear-gradient(180deg, #E6E2D8, rgba(230, 226, 216, 0.25)); }
  .chart .bar.rinse { background: repeating-linear-gradient(135deg, rgba(154, 150, 140, 0.55) 0 3px, rgba(154, 150, 140, 0.18) 3px 6px); }
  .chart .val { position: absolute; bottom: calc(100% + 3px); left: 50%; transform: translateX(-50%); font-size: .58rem; color: var(--muted); white-space: nowrap; font-family: 'JetBrains Mono', monospace; }
  .chart .idx { font-size: .6rem; color: var(--muted); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }
  @keyframes barGrow { from { transform: scaleY(0); opacity: 0; } to { transform: scaleY(1); opacity: 1; } }

  .btn-primary {
    display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
    padding: .95rem 1.4rem; border-radius: 16px; font-weight: 500; letter-spacing: .01em;
    color: #1A1917;
    background: linear-gradient(135deg, color-mix(in srgb, var(--c, #C87D55) 100%, white 12%), color-mix(in srgb, var(--c, #C87D55) 80%, #D9A752));
    box-shadow: 0 12px 30px -14px color-mix(in srgb, var(--c, #C87D55) 80%, transparent);
    transition: transform .25s, box-shadow .25s, filter .25s;
  }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06); }
  .btn-primary:active { transform: translateY(0); }
  .btn-ghost {
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
    padding: .7rem 1.1rem; border-radius: 14px; font-size: .875rem;
    color: var(--text); border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.03);
    transition: all .25s;
  }
  .btn-ghost:hover { background: rgba(255, 255, 255, 0.07); }
  .btn-ghost:disabled { opacity: .35; pointer-events: none; }
  .btn-danger { color: #E8A99E; border-color: rgba(196, 91, 75, 0.35); }
  .btn-danger:hover { background: rgba(196, 91, 75, 0.12); }

  /* ── Timer ── */
  .timer-wrap { position: relative; width: var(--timer-size); height: var(--timer-size); flex-shrink: 0; }
  .timer-wrap::before {
    content: ''; position: absolute; inset: 7%; border-radius: 50%;
    opacity: 0; transition: opacity 1.2s ease;
    box-shadow: 0 0 40px 4px color-mix(in srgb, var(--accent) 22%, transparent), 0 0 100px 18px color-mix(in srgb, var(--accent) 9%, transparent);
  }
  .timer-wrap.running::before { opacity: 1; animation: breathe 5.5s ease-in-out infinite; }
  @keyframes breathe {
    0%, 100% { transform: scale(0.985); box-shadow: 0 0 32px 2px color-mix(in srgb, var(--accent) 16%, transparent), 0 0 80px 10px color-mix(in srgb, var(--accent) 7%, transparent); }
    50% { transform: scale(1.015); box-shadow: 0 0 54px 8px color-mix(in srgb, var(--accent) 28%, transparent), 0 0 130px 26px color-mix(in srgb, var(--accent) 12%, transparent); }
  }
  .timer-face {
    position: absolute; inset: 9%; border-radius: 50%;
    background: radial-gradient(circle at 50% 35%, rgba(255, 255, 255, 0.045), rgba(0, 0, 0, 0.12) 70%);
    border: 1px solid var(--line);
  }
  .ring-track { fill: none; stroke: rgba(255, 255, 255, 0.06); stroke-width: 5; }
  .ring-progress { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset .1s linear, stroke .6s; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 55%, transparent)); }
  .timer-digits { font-size: calc(var(--timer-size) * 0.215); line-height: 1; letter-spacing: -0.02em; font-weight: 400; transition: color .4s; }
  .timer-digits.done { font-family: 'Noto Serif SC', serif; color: var(--accent); }
  .timer-wrap.ending .timer-digits { color: var(--accent); }
  .timer-wrap.ending .ring-progress { animation: endPulse .5s ease-in-out infinite alternate; }
  @keyframes endPulse { to { stroke-opacity: .45; } }

  .ctrl-main {
    width: 4.5rem; height: 4.5rem; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    color: #1A1917; background: var(--accent);
    box-shadow: 0 14px 34px -12px color-mix(in srgb, var(--accent) 85%, transparent), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    transition: transform .2s, filter .2s;
  }
  .ctrl-main:hover { filter: brightness(1.08); }
  .ctrl-main:active { transform: scale(.96); }
  .ctrl-main:disabled { opacity: .35; pointer-events: none; }
  .ctrl-main .ico { width: 1.7rem; height: 1.7rem; }
  .ctrl { width: 3rem; height: 3rem; }
  .ctrl .ico { width: 1.15rem; height: 1.15rem; }

  .adj {
    display: inline-flex; align-items: center; gap: .4rem;
    padding: .55rem .95rem; border-radius: 999px; font-size: .82rem;
    color: var(--muted); border: 1px solid var(--line); background: rgba(255, 255, 255, 0.02);
    transition: all .25s;
  }
  .adj:hover { color: var(--text); border-color: var(--line-2); }
  .adj:disabled { opacity: .35; pointer-events: none; }
  .adj b { font-family: 'JetBrains Mono', monospace; font-weight: 500; color: var(--text); }

  .step-kicker { font-size: .7rem; letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }

  /* ── Timeline ── */
  .timeline { position: relative; display: flex; gap: 0; overflow-x: auto; scrollbar-width: thin; padding: .4rem .25rem .6rem; scroll-snap-type: x proximity; }
  .tl-step { position: relative; flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: .35rem; padding: 0 .55rem; scroll-snap-align: center; }
  .tl-step + .tl-step::before {
    content: ''; position: absolute; top: 17px; right: calc(50% + 19px); width: calc(100% - 38px + 0px); height: 1px;
    background: var(--line-2);
  }
  .tl-step.done + .tl-step::before { background: color-mix(in srgb, var(--accent) 55%, transparent); }
  .tl-dot {
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: .72rem; font-family: 'JetBrains Mono', monospace; color: var(--muted);
    border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.02);
    transition: all .3s;
  }
  .tl-step:hover .tl-dot { border-color: rgba(255, 255, 255, 0.25); color: var(--text); }
  .tl-step.done .tl-dot { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .tl-step.current .tl-dot { color: #1A1917; background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
  .tl-step.prep .tl-dot { border-style: dashed; }
  .tl-time { font-size: .68rem; color: var(--muted); }
  .tl-step.current .tl-time { color: var(--text); }
  .tl-step .tl-dot .ico { width: .9rem; height: .9rem; }

  /* ── Modal ── */
  .modal-wrap { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; padding: 0; }
  @media (min-width: 640px) { .modal-wrap { align-items: center; padding: 1.5rem; } }
  .modal-wrap .scrim { position: absolute; inset: 0; background: rgba(12, 12, 11, 0.7); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); animation: fade .3s ease both; }
  .modal {
    position: relative; width: 100%; max-width: 460px; max-height: 92vh; overflow-y: auto;
    border-radius: 24px 24px 0 0; padding: 1.4rem 1.3rem calc(1.4rem + env(safe-area-inset-bottom));
    background: rgba(30, 29, 27, 0.97); border: 1px solid var(--line-2);
    animation: rise .45s cubic-bezier(.2, .8, .2, 1) both;
  }
  @media (min-width: 640px) { .modal { border-radius: 24px; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } }
  .cup-btn { color: rgba(154, 150, 140, 0.45); transition: color .2s, transform .2s; padding: .2rem; }
  .cup-btn:hover { transform: translateY(-2px); }
  .cup-btn.on { color: var(--accent); }
  .cup-btn .ico { width: 2.1rem; height: 2.1rem; }
  .qi { cursor: pointer; }
  .qi input { position: absolute; opacity: 0; pointer-events: none; }
  .qi span { display: inline-block; padding: .45rem .85rem; border-radius: 999px; font-size: .82rem; color: var(--muted); border: 1px solid var(--line); transition: all .25s; }

const CLAY_BONUS = 0.5;
const VOLUME_MIN = 50, VOLUME_MAX = 400;
const VOLUME_PRESETS = [80, 100, 130, 160, 200];
const MATERIALS = {
  porcelain: { name: 'Фарфор / Стекло', note: 'Гайвань: нейтральная теплоотдача — базовые параметры без изменений.' },
  clay:      { name: 'Исинская глина',  note: 'Толстые пористые стенки долго держат жар. +0.5 г к навеске: поры глины забирают часть аромата.' }
};
const CLAY_WARNING = 'Глина слишком долго держит жар! Для зеленых и белых чаев лучше взять фарфор или не закрывать крышку';
const LID_WARNING = 'Держите крышку гайвани приоткрытой между проливами';
const MIN_STEEP_SEC = 3;

/** Итоговый вес (г) = round((V/100 × grams_per_100ml) + clay_bonus, 1) */
function calcGrams(tea, volume, material) {
  const bonus = material === 'clay' ? CLAY_BONUS : 0;
  return Math.round(((volume / 100) * tea.grams_per_100ml + bonus) * 10) / 10;
}

/** Нелинейные кривые экстракции → массив секунд длиной max_steeps */
function generateSteepTimes(tea) {
  const B = tea.base_sec, S = tea.step_sec, out = [];
  for (let i = 1; i <= tea.max_steeps; i++) {
    const prev = out[i - 2];
    let t;
    switch (tea.curve_type) {
      case 'pressed':
        if (i === 1)      t = B;
        else if (i === 2) t = Math.max(5, Math.round(B * 0.7));
        else if (i === 3) t = Math.max(6, Math.round(B * 0.8));
        else if (i === 4) t = B + S;
        else {
          t = prev + Math.round(S * Math.pow(1.4, i - 4));
          if (t > 40) t = Math.round(t / 5) * 5;
        }
        break;
      case 'rolled':
        if (i === 1 || i === 3) t = B;
        else if (i === 2)       t = Math.max(5, B - 5);
        else                    t = B + (i - 3) * S;
        break;
      default: // loose
        t = i <= 4 ? B + (i - 1) * S : prev + Math.round(S * 1.3);
    }
    out.push(t);
  }
  return out;
}

/* ════════════════════════════════════════════════════════════════════
   5. ЗВУКОВОЙ ДВИЖОК (Web Audio API)
   ════════════════════════════════════════════════════════════════════ */
class SoundEngine {
  constructor(muted) {
    this.ctx = null;
    this.master = null;
    this.muted = !!muted;
  }
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  setMuted(m) {
    this.muted = m;
    if (this.ctx) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05);
  }
  _ready() { return this.muted ? null : this.ensure(); }

  _voice(ctx, { type = 'sine', freq, freqEnd, detune = 0, peak, attack, decay, at, dest }) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, at);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, at + decay * 0.5);
    o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay);
    o.connect(g); g.connect(dest || this.master);
    o.start(at); o.stop(at + attack + decay + 0.05);
  }

  /** Старт пролива: капля воды + мягкий деревянный клик */
  click() {
    const ctx = this._ready(); if (!ctx) return;
    const t = ctx.currentTime + 0.005;
    this._voice(ctx, { freq: 1300, freqEnd: 420, peak: 0.28, attack: 0.006, decay: 0.17, at: t });
    this._voice(ctx, { type: 'triangle', freq: 190, freqEnd: 140, peak: 0.12, attack: 0.003, decay: 0.08, at: t });
  }

  /** Предупреждение за 2 секунды: тихий высокий обертон */
  warn() {
    const ctx = this._ready(); if (!ctx) return;
    const t = ctx.currentTime + 0.005;
    this._voice(ctx, { freq: 1760, peak: 0.06, attack: 0.01, decay: 0.9, at: t });
    this._voice(ctx, { freq: 2640, detune: 4, peak: 0.025, attack: 0.01, decay: 0.6, at: t });
  }

  /** Финал пролива: поющая чаша, 3.5 с экспоненциального затухания */
  gong() {
    const ctx = this._ready(); if (!ctx) return;
    const t = ctx.currentTime + 0.01, dur = 3.5;
    const bus = ctx.createGain();
    bus.gain.value = 0.85;
    bus.connect(this.master);
    const partials = [
      { type: 'sine',     freq: 432,  detune: 0,  peak: 0.26, decay: dur },
      { type: 'sine',     freq: 432,  detune: 7,  peak: 0.10, decay: dur },        // биение «поющей чаши»
      { type: 'triangle', freq: 648,  detune: -5, peak: 0.07, decay: dur * 0.85 },
      { type: 'sine',     freq: 864,  detune: 6,  peak: 0.09, decay: dur * 0.75 },
      { type: 'sine',     freq: 1296, detune: -8, peak: 0.025, decay: dur * 0.45 }
    ];
    partials.forEach(p => this._voice(ctx, { ...p, attack: 0.012, decay: p.decay - 0.012, at: t, dest: bus }));
  }
}

/* ════════════════════════════════════════════════════════════════════
   6. ХРАНИЛИЩЕ И СОСТОЯНИЕ
   ════════════════════════════════════════════════════════════════════ */
const KEYS = { settings: 'gongfu_settings_v1', log: 'gongfu_log_v1', session: 'gongfu_session_v1', muted: 'gongfu_muted_v1' };
const store = {
  get(key, fallback) {
    try { const v = localStorage.getItem(key); return v == null ? fallback : JSON.parse(v); }
    catch { return fallback; }
  },
  set(key, value) {
    try { localStorage.setItem(key, JSON.stringify(value)); } catch { /* приватный режим */ }
  },
  remove(key) { try { localStorage.removeItem(key); } catch {} }
};

const savedSettings = store.get(KEYS.settings, {});
const state = {
  screen: 'setup',
  volume: clampVolume(savedSettings.volume ?? 100),
  material: savedSettings.material === 'clay' ? 'clay' : 'porcelain',
  category: 'all',
  query: '',
  selectedId: TEA_BY_ID[savedSettings.selectedId] ? savedSettings.selectedId : TEA_DATABASE[0].id,
  session: null,
  log: store.get(KEYS.log, []),
  modal: null
};
const sound = new SoundEngine(store.get(KEYS.muted, false));

function saveSettings() {
  store.set(KEYS.settings, { volume: state.volume, material: state.material, selectedId: state.selectedId });
}

/* ════════════════════════════════════════════════════════════════════
   7. УТИЛИТЫ
   ════════════════════════════════════════════════════════════════════ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const pad = n => String(n).padStart(2, '0');
const RING_C = 2 * Math.PI * 90;

function clampVolume(v) {
  v = Math.round(Number(v));
  if (!Number.isFinite(v)) return 100;
  return Math.min(VOLUME_MAX, Math.max(VOLUME_MIN, v));
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function norm(s) {
  return String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ё/g, 'е');
}
/** «Шу Пуэр (Прессованный блин)» → ['Шу Пуэр', 'Прессованный блин'] */
function splitParen(s) {
  const m = String(s).match(/^(.*?)\s*\((.*)\)\s*$/);
  return m ? [m[1], m[2]] : [s, ''];
}
function fmtSec(s) {
  return s < 60 ? `${s}с` : `${Math.floor(s / 60)}:${pad(s % 60)}`;
}
function fmtLongSec(s) {
  return s < 60 ? `${s} с` : `${Math.floor(s / 60)} мин ${pad(s % 60)} с`;
}
function fmtClock(ms) {
  if (ms >= 60000) {
    const s = Math.ceil(ms / 1000);
    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  }
  return (Math.max(0, ms) / 1000).toFixed(1).padStart(4, '0');
}
function fmtDuration(totalSec) {
  if (totalSec < 60) return `${totalSec} с`;
  const m = Math.round(totalSec / 60);
  return m < 60 ? `≈ ${m} мин` : `≈ ${Math.floor(m / 60)} ч ${pad(m % 60)} мин`;
}
function pluralRu(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function isTypingTarget(el) {
  return !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

let toastTimer = null;
function toast(msg, ms = 3000) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

      ${id === 'all' ? '' : '<span class="dot"></span>'}${label}<span class="count">${count}</span>
    </button>`;
  $('#filters').innerHTML =
    pill('all', 'Все', '#E6E2D8', TEA_DATABASE.length) +

}

function filteredTeas() {
  const words = norm(state.query).split(/\s+/).filter(Boolean);
  return TEA_DATABASE.filter(t => {
    if (state.category !== 'all' && t.categoryId !== state.category) return false;
    if (!words.length) return true;
    const hay = norm([t.name_ru, t.name_cn, t.id.replace(/-/g, ' '), t.categoryName, CURVES[t.curve_type].label, ...t.flavor_tags].join(' '));
    return words.every(w => hay.includes(w));
  });
}

function curveChartHTML(tea, times) {
  const items = [];
  if (tea.needs_rinse) items.push({ sec: tea.rinse_sec, label: 'П', rinse: true });
  times.forEach((s, i) => items.push({ sec: s, label: String(i + 1), dip: i > 0 && s < times[i - 1] }));
  const max = Math.max(...items.map(x => x.sec));
  // √-шкала — чтобы просадки на ранних проливах оставались видны даже рядом с длинными поздними
  return `<div class="chart" role="img" aria-label="Кривая проливов: ${times.join(', ')} секунд">
    ${items.map((x, i) => {
      const h = Math.max(6, Math.sqrt(x.sec / max) * 100);
      return `<div class="col">
        <div class="bar ${x.rinse ? 'rinse' : ''} ${x.dip ? 'dip' : ''}" style="height:${h}%; animation-delay:${i * 35}ms">
          <span class="val">${fmtSec(x.sec)}</span>
        </div>
        <span class="idx">${x.label}</span>
      </div>`;
    }).join('')}
  </div>`;
}

/* ════════════════════════════════════════════════════════════════════
   9. ЭКРАН 2 — СЕССИЯ (STATE MACHINE)
   ════════════════════════════════════════════════════════════════════ */
function buildSteps(tea, steepTimes) {
  const steps = [];
  if (tea.needs_rinse && tea.rinse_sec > 0) steps.push({ kind: 'rinse', sec: tea.rinse_sec });
  if (tea.warm_breath_sec > 0) steps.push({ kind: 'breath', sec: tea.warm_breath_sec });
  steepTimes.forEach((sec, i) => steps.push({ kind: 'steep', n: i + 1, sec }));
  return steps;
}

function sessionHasProgress() {
  const s = state.session;
  return !!s && (s.completed.length > 0 || s.running || s.remainingMs < s.steps[s.idx].sec * 1000);
}

function startSession(tea, opts = {}) {
  if (sessionHasProgress() && !confirm('Текущее чаепитие ещё не завершено. Начать новую церемонию? Несохранённый прогресс будет потерян.')) return;
  const times = Array.isArray(opts.steepTimes) && opts.steepTimes.length ? opts.steepTimes.slice() : generateSteepTimes(tea);
  const steps = buildSteps(tea, times);
  state.session = {
    teaId: tea.id,
    volume: state.volume,
    material: state.material,
    grams: calcGrams(tea, state.volume, state.material),
    steps,
    idx: 0,
    completed: [],
    finished: false,
    startedAt: Date.now(),
    adjustTotal: 0,
    running: false,
    endAt: 0,
    remainingMs: steps[0].sec * 1000,
    warned: false
  };
  persistSession();
  closeSheet();
  sound.ensure();
  showScreen('session');
  toast(`Отмерьте ${state.session.grams.toFixed(1)} г и нагрейте воду до ${tea.temp_c}°C`);
}

function persistSession() {
  const s = state.session;
  if (!s) { store.remove(KEYS.session); return; }
  const { teaId, volume, material, grams, steps, idx, completed, finished, startedAt, adjustTotal } = s;
  store.set(KEYS.session, { teaId, volume, material, grams, steps, idx, completed, finished, startedAt, adjustTotal });
}

function restoreSession() {
  const d = store.get(KEYS.session, null);
  if (!d || !TEA_BY_ID[d.teaId] || !Array.isArray(d.steps) || !d.steps.length) return;
  const idx = Math.min(Math.max(0, d.idx | 0), d.steps.length - 1);
  state.session = {
    ...d, idx,
    completed: Array.isArray(d.completed) ? d.completed : [],
    adjustTotal: d.adjustTotal || 0,
    running: false, endAt: 0, warned: false,
    remainingMs: d.finished ? 0 : d.steps[idx].sec * 1000
  };
}

function curStep() { const s = state.session; return s ? s.steps[s.idx] : null; }

function startTimer(silent = false) {
  const s = state.session;
  if (!s || s.finished || s.running) return;
  if (s.remainingMs <= 0) s.remainingMs = curStep().sec * 1000;
  if (s.remainingMs > 2050) s.warned = false;
  s.endAt = performance.now() + s.remainingMs;
  s.running = true;
  if (silent) sound.ensure(); else sound.click();
  updateTimerUI(true);
  updateNav();
}

function pauseTimer() {
  const s = state.session;
  if (!s || !s.running) return;
  s.remainingMs = Math.max(0, s.endAt - performance.now());
  s.running = false;
  updateTimerUI(true);
  updateNav();
}

function toggleTimer() {
  const s = state.session;
  if (!s) return;
  if (s.finished) { toast('Церемония завершена. Сохраните её в дневник или выберите пролив на ленте.'); return; }
  s.running ? pauseTimer() : startTimer();
}

function resetStep() {
  const s = state.session;
  if (!s) return;
  s.running = false;
  s.finished = false;
  s.remainingMs = curStep().sec * 1000;
  s.warned = false;
  renderSession();
  updateNav();
}

function goToStep(i) {
  const s = state.session;
  if (!s || i < 0 || i >= s.steps.length) return;
  s.running = false;
  s.finished = false;
  s.idx = i;
  s.remainingMs = s.steps[i].sec * 1000;
  s.warned = false;
  persistSession();
  renderSession();
  updateNav();
}

function skipBreath() {
  const s = state.session;
  if (!s || curStep().kind !== 'breath') return;
  if (!s.completed.includes(s.idx)) s.completed.push(s.idx);
  goToStep(s.idx + 1);
  toast('Переходим к 1-му проливу');
}

function completeStep() {
  const s = state.session;
  const step = curStep();
  s.running = false;
  s.remainingMs = 0;
  if (!s.completed.includes(s.idx)) s.completed.push(s.idx);
  sound.gong();
  if (navigator.vibrate) { try { navigator.vibrate([180, 90, 180]); } catch {} }

  const nextIdx = s.idx + 1;
  if (nextIdx >= s.steps.length) {
    s.finished = true;
    persistSession();
    renderSession();
    updateNav();
    toast('Последний пролив завершён. Спасибо листу 🍵', 4500);
    return;
  }
  s.idx = nextIdx;
  s.remainingMs = s.steps[nextIdx].sec * 1000;
  s.warned = false;
  const next = s.steps[nextIdx];
  persistSession();
  renderSession();

  if (step.kind === 'rinse') {
    if (next.kind === 'breath') {
      startTimer(true); // прогрев запускается автоматически
      toast('Слейте промывку. Лист «дышит» в горячей посуде');
    } else {
      toast('Слейте промывку. Заливайте 1-й пролив');
    }
  } else if (step.kind === 'breath') {
    toast(`Лист проснулся. Пролив 1 — ${fmtLongSec(next.sec)}`);
  } else {
    toast(`Сливайте настой! Далее пролив ${next.n} — ${fmtLongSec(next.sec)}`);
  }
  updateNav();
}

/** Живая коррекция: сдвигает текущий и все будущие проливы (минимум 3 с) */
function adjustCurve(delta) {
  const s = state.session;
  if (!s) return;
  const cur = curStep();
  const oldCurSec = cur.sec;
  let affected = 0;
  for (let j = s.idx; j < s.steps.length; j++) {
    const st = s.steps[j];
    if (st.kind !== 'steep') continue;
    if (j === s.idx && s.finished) continue;
    st.sec = Math.max(MIN_STEEP_SEC, st.sec + delta);
    affected++;
  }
  if (!affected) { toast('Не осталось проливов для коррекции'); return; }

  if (cur.kind === 'steep' && !s.finished) {
    const live = s.running ? Math.max(0, s.endAt - performance.now()) : s.remainingMs;
    const elapsed = Math.max(0, oldCurSec * 1000 - live);
    let remaining = cur.sec * 1000 - elapsed;
    if (elapsed > 0) remaining = Math.max(300, remaining);
    s.remainingMs = remaining;
    if (s.running) s.endAt = performance.now() + remaining;
    if (remaining > 2050) s.warned = false;
  }
  s.adjustTotal += delta;
  persistSession();
  renderSession();
  toast(`${delta < 0 ? 'Крепковато' : 'Слабовато'}: ${delta > 0 ? '+' : '−'}${Math.abs(delta)} с для ${affected} ${pluralRu(affected, 'пролива', 'проливов', 'проливов')}`);
}

function tick() {
  const s = state.session;
  if (!s || !s.running) return;
  s.remainingMs = Math.max(0, s.endAt - performance.now());
  const step = curStep();
  if (!s.warned && s.remainingMs <= 2000 && step.sec >= 4) {
    s.warned = true;
    sound.warn();
  }
  if (s.remainingMs <= 0) { completeStep(); return; }
  updateTimerUI();
  updateNav();
}

function stepTitle(s) {
  const step = s.steps[s.idx];
  const totalSteeps = s.steps.filter(x => x.kind === 'steep').length;
  if (s.finished) return { kicker: 'Все проливы позади', title: 'Церемония завершена' };
  if (step.kind === 'rinse') return { kicker: 'Нулевой пролив', title: 'Промывка листа' };
  if (step.kind === 'breath') return { kicker: 'Пауза после промывки', title: 'Прогрев дыханием' };
  return { kicker: `Пролив ${step.n} из ${totalSteeps}`, title: `${step.n}-й пролив` };
}

function stepHint(s, tea) {
  const step = s.steps[s.idx];
  if (s.finished) return 'Лист отдал всё, что мог. Сохраните впечатления в дневник.';
  if (step.kind === 'rinse') return 'Залейте воду и слейте через сито — пить этот настой не нужно';
  if (step.kind === 'breath') return 'Укутайте промытый лист в горячей посуде, вдохните аромат с крышки гайвани';
  const full = s.remainingMs >= step.sec * 1000;
  if (s.running) return 'Настаивается… За 2 секунды до гонга прозвучит тихий сигнал — берите гайвань в руки.';
  if (!full) return 'Пауза. Продолжите, когда будете готовы.';
  return `Залейте воду ${tea.temp_c}°C и нажмите «Старт». Сливайте настой по звуку гонга.`;
}

function updateTimerUI(force = false) {
  const s = state.session;
  if (!s || state.screen !== 'session') { updateTitle(); return; }
  const digits = $('#timer-digits');
  if (!digits) return;
  const step = curStep();
  const total = step.sec * 1000;
  const rem = s.finished ? 0 : s.remainingMs;

  if (s.finished) {
    digits.textContent = '完';
    digits.classList.add('done');
    $('#timer-sub').textContent = 'завершено';
  } else {
    digits.textContent = fmtClock(rem);
    digits.classList.remove('done');
    $('#timer-sub').textContent = `из ${fmtLongSec(step.sec)}`;
  }
  $('#ring').setAttribute('stroke-dashoffset', (RING_C * (1 - (s.finished ? 0 : rem / total))).toFixed(2));

  const wrap = $('#timer-wrap');
  wrap.classList.toggle('running', s.running);
  wrap.classList.toggle('ending', s.running && rem <= 2000);

  const btn = $('#play-btn');
  const mode = s.running ? 'pause' : 'play';
  if (force || btn.dataset.mode !== mode) {
    btn.dataset.mode = mode;
    btn.innerHTML = s.running ? ICON.pause : ICON.play;
    btn.setAttribute('aria-label', s.running ? 'Пауза (Пробел)' : 'Старт (Пробел)');
    $('#step-hint').textContent = stepHint(s, TEA_BY_ID[s.teaId]);
  }
  updateTitle();
}

function updateTitle() {
  const s = state.session;
  if (s && s.running) {
    const step = curStep();
    const label = step.kind === 'steep' ? `Пролив ${step.n}` : step.kind === 'rinse' ? 'Промывка' : 'Прогрев';
    document.title = `${fmtClock(s.remainingMs)} · ${label} — Gongfu`;
  } else {
    document.title = 'Gongfu Tea Master';
  }
}

    material: s.material,
    grams: s.grams,
    steepsDone: s.steps.filter((st, i) => st.kind === 'steep' && s.completed.includes(i)).length,
    totalSteeps: s.steps.filter(st => st.kind === 'steep').length,
    steepTimes: s.steps.filter(st => st.kind === 'steep').map(st => st.sec),
    adjustTotal: s.adjustTotal,
    rating: state.modal ? state.modal.rating : 0,
    qi: $$('input[name="qi"]:checked').map(i => i.value),
    note: ($('#note')?.value || '').trim()
  };
  state.log.unshift(entry);
  store.set(KEYS.log, state.log);
  closeModal();
  endSession();
  showScreen('log');
  toast('Чаепитие сохранено в дневник');
}

function endSession() {
  state.session = null;
  persistSession();
  updateNav();
  updateTitle();
}

function renderLog() {
  const root = $('#screen-log');
  const log = state.log;
  if (!log.length) {
    root.innerHTML = `
      <div class="max-w-md mx-auto text-center glass rounded-[24px] p-10">
        <div class="hz text-6xl accent opacity-70">記</div>
        <h2 class="serif text-3xl mt-4">Дневник пока пуст</h2>
        <p class="text-sage mt-2 text-sm">Завершите первую церемонию — здесь появятся оценки, Ча Ци и ваши заметки.</p>
        <button type="button" class="btn-primary mt-6" data-action="tab" data-tab="setup">Выбрать чай</button>
      </div>`;
    return;
  }
  const freq = {};
  log.forEach(e => { freq[e.teaId] = (freq[e.teaId] || 0) + 1; });
  const favId = Object.keys(freq).sort((a, b) => freq[b] - freq[a])[0];
  const favName = TEA_BY_ID[favId] ? splitParen(TEA_BY_ID[favId].name_ru)[0] : '—';
  const totalSteeps = log.reduce((a, e) => a + (e.steepsDone || 0), 0);
  const rated = log.filter(e => e.rating);
  const avg = rated.length ? (rated.reduce((a, e) => a + e.rating, 0) / rated.length).toFixed(1) : '—';

  root.innerHTML = `
    <div class="max-w-4xl mx-auto">
      <div class="flex items-end justify-between gap-3 flex-wrap">
        <div>
          <div class="step-kicker">茶记 · Чай Цзи</div>
          <h2 class="serif text-[2.2rem] leading-tight font-semibold">Чайный дневник</h2>
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mt-4">
        <div class="stat"><div class="k">Чаепитий</div><div class="v text-lg">${log.length}</div></div>
        <div class="stat"><div class="k">Проливов</div><div class="v text-lg">${totalSteeps}</div></div>
        <div class="stat"><div class="k">Средняя оценка</div><div class="v text-lg">${avg}</div></div>
        <div class="stat"><div class="k">Любимый</div><div class="v text-sm truncate" style="font-family:inherit">${favName}</div></div>
      </div>
      <div class="mt-5 space-y-3">
        ${log.map(logEntryHTML).join('')}
      </div>
    </div>`;
}

function logEntryHTML(e) {
  const c = CAT[e.categoryId] || { color: '#9A968C', short: '' };
  const tea = TEA_BY_ID[e.teaId];
  const [main, sub] = splitParen(e.teaName);
  const date = new Date(e.date);
  const dateStr = date.toLocaleString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  const cups = [1, 2, 3, 4, 5].map(v => `<span style="color:${v <= e.rating ? c.color : 'rgba(154,150,140,.35)'}">${v <= e.rating ? ICON.cupFill : ICON.cup}</span>`).join('');
  return `
    <article class="glass rounded-[20px] p-4 sm:p-5 relative overflow-hidden" style="--c:${c.color}">
      <span class="absolute left-0 top-4 bottom-4 w-[2px] rounded" style="background:${c.color}"></span>
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="text-[11px] text-sage">${dateStr}</div>
          <h3 class="serif text-[1.45rem] leading-tight font-semibold mt-0.5">${escapeHtml(main)}</h3>
          ${sub ? `<div class="text-[12px] text-sage">${escapeHtml(sub)}</div>` : ''}
        </div>
        <div class="flex items-center gap-0.5 text-lg shrink-0" aria-label="Оценка ${e.rating || 0} из 5">${cups}</div>
      </div>
      <div class="mono text-[12px] text-sage mt-2">
        ${e.grams.toFixed(1)} г · ${e.volume} мл · ${MATERIALS[e.material]?.name || ''} · ${e.steepsDone}/${e.totalSteeps} ${pluralRu(e.totalSteeps, 'пролив', 'пролива', 'проливов')}${e.adjustTotal ? ` · коррекция ${e.adjustTotal > 0 ? '+' : '−'}${Math.abs(e.adjustTotal)}с` : ''}
      </div>
      <div class="mono text-[11px] text-sage/80 mt-1 truncate" title="Кривая: ${e.steepTimes.join(' · ')} с">кривая: ${e.steepTimes.map(fmtSec).join(' · ')}</div>
      ${e.qi && e.qi.length ? `<div class="flex flex-wrap gap-1.5 mt-3">${e.qi.map(q => `<span class="badge">${escapeHtml(q)}</span>`).join('')}</div>` : ''}
      ${e.note ? `<p class="serif italic text-[1.1rem] leading-snug mt-3 whitespace-pre-line">«${escapeHtml(e.note)}»</p>` : ''}
      <div class="flex gap-2 mt-4">
        <button type="button" class="btn-ghost !py-2 !px-3 !text-[13px]" data-action="log-repeat" data-id="${e.id}" ${tea ? '' : 'disabled'}>${ICON.repeat}<span>Повторить сессию</span></button>
        <button type="button" class="btn-ghost btn-danger !py-2 !px-3 !text-[13px]" data-action="log-delete" data-id="${e.id}" aria-label="Удалить запись">${ICON.trash}<span class="hidden sm:inline">Удалить</span></button>
      </div>
    </article>`;
}

function deleteLogEntry(id) {
  if (!confirm('Удалить эту запись из дневника?')) return;
  state.log = state.log.filter(e => e.id !== id);
  store.set(KEYS.log, state.log);
  renderLog();
  toast('Запись удалена');
}

function repeatLogEntry(id) {
  const e = state.log.find(x => x.id === id);
  const tea = e && TEA_BY_ID[e.teaId];
  if (!tea) return;
  state.volume = clampVolume(e.volume);
  state.material = e.material === 'clay' ? 'clay' : 'porcelain';
  state.selectedId = tea.id;
  saveSettings();
  updateVesselUI();
  renderGrid();
  renderDetail();
  startSession(tea, { steepTimes: e.steepTimes });
}

/* ════════════════════════════════════════════════════════════════════
   11. НАВИГАЦИЯ
   ════════════════════════════════════════════════════════════════════ */
function showScreen(name) {
  state.screen = name;
  ['setup', 'session', 'log'].forEach(n => {
    const el = $(`#screen-${n}`);
    el.hidden = n !== name;
    if (n === name) { el.classList.remove('screen-in'); void el.offsetWidth; el.classList.add('screen-in'); }
  });
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
  if (name !== 'setup') closeSheet();
  if (name === 'session') renderSession();
  if (name === 'log') renderLog();
  if (name === 'setup') renderDetail();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  updateNav();
}

function updateNav() {
  const s = state.session;
  const dot = $('#nav-dot'), timer = $('#nav-timer');
  dot.hidden = !s;
  dot.classList.toggle('pulse', !!(s && s.running));
  const showTimer = !!(s && s.running && state.screen !== 'session');
  timer.hidden = !showTimer;
  if (showTimer) timer.textContent = fmtClock(s.remainingMs);
}

function updateMuteBtn() {
  const b = $('#mute-btn');
  b.innerHTML = sound.muted ? ICON.soundOff : ICON.soundOn;
  b.setAttribute('aria-label', sound.muted ? 'Включить звук' : 'Выключить звук');
  b.title = sound.muted ? 'Звук выключен' : 'Звук включён';
}

/* ════════════════════════════════════════════════════════════════════
   12. СОБЫТИЯ
   ════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  // Кнопки сессии теряют фокус, чтобы пробел не «кликал» их повторно
  if (el.tagName === 'BUTTON' && el.closest('#screen-session')) el.blur();
  const a = el.dataset.action;
  switch (a) {
    case 'tab':
      if (el.dataset.tab === 'session' && !state.session) { toast('Выберите чай и начните церемонию'); }
      showScreen(el.dataset.tab);
      break;
    case 'mute':
      sound.setMuted(!sound.muted);
      store.set(KEYS.muted, sound.muted);
      updateMuteBtn();
      if (!sound.muted) sound.click();
      break;
    case 'preset-vol':     setVolume(el.dataset.val); break;
    case 'material':       setMaterial(el.dataset.val); break;
    case 'filter':
      state.category = el.dataset.val;
      renderFilters();
      renderGrid();
      break;
    case 'clear-search':
      state.query = '';
      $('#search').value = '';
      renderGrid();
      $('#search').focus();
      break;
    case 'select-tea':     selectTea(el.dataset.id); break;
    case 'close-sheet':    closeSheet(); break;
    case 'start-ceremony': startSession(TEA_BY_ID[el.dataset.id]); break;
    case 'toggle-timer':   toggleTimer(); break;
    case 'reset-step':     resetStep(); break;
    case 'prev-step':      goToStep(state.session.idx - 1); break;
    case 'next-step':      goToStep(state.session.idx + 1); break;
    case 'goto-step':      goToStep(Number(el.dataset.idx)); break;
    case 'skip-breath':    skipBreath(); break;
    case 'adjust':         adjustCurve(Number(el.dataset.delta)); break;
    case 'finish-session': openFinishModal(); break;
    case 'rate':           setRating(Number(el.dataset.val)); break;
    case 'modal-save':     saveLogEntry(); break;
    case 'modal-cancel':   closeModal(); break;
    case 'modal-discard':
      if (confirm('Завершить чаепитие без записи в дневник?')) {
        closeModal();
        endSession();
        showScreen('setup');
      }
      break;
    case 'log-delete':     deleteLogEntry(el.dataset.id); break;
    case 'log-repeat':     repeatLogEntry(el.dataset.id); break;
  }
});

$('#vol-range').addEventListener('input', e => setVolume(e.target.value));
$('#vol-input').addEventListener('change', e => { setVolume(e.target.value); e.target.value = state.volume; });
$('#vol-input').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#search').addEventListener('input', e => { state.query = e.target.value; renderGrid(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.modal) { closeModal(); return; }
    if ($('#detail').classList.contains('open')) { closeSheet(); return; }
  }
  // Горячие клавиши не срабатывают в полях ввода (поиск, заметка, объём)
  if (isTypingTarget(e.target)) return;
  if (state.modal || state.screen !== 'session' || !state.session) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.code) {
    case 'Space':      e.preventDefault(); if (!e.repeat) toggleTimer(); break;
    case 'KeyR':       e.preventDefault(); resetStep(); break;
    case 'ArrowLeft':  e.preventDefault(); goToStep(state.session.idx - 1); break;
    case 'ArrowRight': e.preventDefault(); goToStep(state.session.idx + 1); break;
  }
});

window.addEventListener('resize', () => { if (window.innerWidth >= 1024) closeSheet(); });

/* ════════════════════════════════════════════════════════════════════
   13. ЗАПУСК
   ════════════════════════════════════════════════════════════════════ */
initSetupStatic();
restoreSession();
updateVesselUI();
renderFilters();
renderGrid();
renderDetail();
updateMuteBtn();
updateNav();
setInterval(tick, 50);
</script>
</body>
</html>

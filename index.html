<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111714">
<title>茶道 ChaDao — Путь чая</title>
<meta name="description" content="茶道 ChaDao — Путь чая: помощник чаепития. Дозировка под посуду, таймер проливов, дневник.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="茶道">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<link rel="stylesheet" href="assets/fonts.css">
<style>
  /* ═══ Dark Jade & Antique Bronze ═══ */
  :root {
    /* Фоны */
    --bg: #111714;
    --bg-secondary: #18211C;
    --surface: #202B24;
    --surface-hover: #27352C;
    --surface-active: #344B3D;
    /* Границы */
    --line: rgba(211, 220, 204, 0.09);
    --line-strong: rgba(211, 220, 204, 0.16);
    --line-accent: rgba(198, 164, 119, 0.42);
    /* Бронзовый акцент */
    --accent: #C6A477;
    --accent-hover: #D5B68B;
    --accent-soft: rgba(198, 164, 119, 0.12);
    --accent-light: #E6D2AD;
    /* Текст */
    --text: #E8E4D9;
    --text-secondary: #B0B5A9;
    --text-muted: #858D81;
    --text-disabled: #626B61;
    /* Семантические цвета */
    --success: #8FAF83;
    --warning: #D9B878;
    --danger: #C77F73;
    --info: #8FA8A0;
    /* Категории чая */
    --tea-puer: #96684A;
    --tea-light-oolong: #B3C085;
    --tea-dark-oolong: #BA8650;
    --tea-red: #C0634F;
    --tea-white: #D2CDAE;
    --tea-green: #7FAE70;
    --tea-yellow: #D2B260;
    /* Эффекты */
    --shadow-soft: 0 8px 28px rgba(0, 0, 0, 0.18);
    --shadow-card: 0 4px 16px rgba(0, 0, 0, 0.12);
    --focus-ring: rgba(198, 164, 119, 0.75);

    /* Производные */
    --tea-puer-bg: #30241C;
    --tea-light-oolong-bg: #2B3324;
    --tea-dark-oolong-bg: #382A1B;
    --tea-red-bg: #3A2420;
    --tea-white-bg: #33332A;
    --tea-green-bg: #223224;
    --tea-yellow-bg: #373019;
    --tea-gaba: #A08FA8;
    --tea-gaba-bg: #2E2A33;
    --tea-sheng: #8E9A5B;
    --tea-sheng-bg: #2B3022;
    --tea-hei: #B8A28E;
    --tea-hei-bg: #2D2723;
    --on-accent: #1B211D;
    color-scheme: dark;
    --ease: cubic-bezier(.2, .8, .2, 1);
    --timer-size: min(70vw, 36vh, 320px);
  }
  @media (min-width: 640px) { :root { --timer-size: min(56vw, 42vh, 340px); } }

  * { -webkit-tap-highlight-color: transparent; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }
  body::before {
    content: '';
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(1100px 560px at 8% -12%, rgba(120, 145, 124, 0.10), transparent 60%),
      radial-gradient(900px 520px at 110% 6%, rgba(198, 164, 119, 0.05), transparent 60%),
      linear-gradient(180deg, var(--bg-secondary) 0, var(--bg) 480px);
  }
  [hidden] { display: none !important; }
  ::selection { background: rgba(198, 164, 119, 0.3); color: var(--text); }

  .serif { font-family: 'Cormorant Garamond', 'Noto Serif SC', Georgia, 'Times New Roman', serif; }
  .hz { font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', 'Cormorant Garamond', serif; letter-spacing: 0.04em; }
  .mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; font-variant-numeric: tabular-nums; }
  .tnum { font-variant-numeric: tabular-nums; }
  .accent { color: var(--accent); }
  .ico { width: 1em; height: 1em; flex-shrink: 0; }

  .panel {
    background: var(--bg-secondary);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-card);
  }

  /* ── Шапка ── */
  .app-header { background: var(--bg); border-bottom: 1px solid var(--line); }
  .tab {
    position: relative;
    padding: 0.5rem 0.85rem;
    border-radius: 999px;
    color: var(--text-muted);
    font-size: 0.875rem;
    transition: color .2s, background-color .2s;
    display: inline-flex; align-items: center; gap: .4rem;
    white-space: nowrap;
  }
  .tab:hover { color: var(--text-secondary); }
  .tab[aria-selected="true"] { color: var(--text); background: var(--surface); }
  .tab .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .tab .live-dot.pulse { animation: pulseDot 1.6s ease-in-out infinite; }
  @keyframes pulseDot { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }

  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 2.5rem; height: 2.5rem; border-radius: 999px;
    color: var(--text-secondary); border: 1px solid var(--line);
    background: transparent;
    transition: color .2s, border-color .2s, background-color .2s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--line-strong); background: var(--surface-hover); }
  .icon-btn:disabled { color: var(--text-disabled); opacity: .5; pointer-events: none; }

  /* ── Бейджи и теги ── */
  .badge {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .2rem .6rem; border-radius: 999px;
    font-size: .72rem; letter-spacing: .02em;
    color: var(--c);
    background: color-mix(in srgb, var(--c) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 24%, transparent);
  }
  .curve-chip {
    display: inline-flex; align-items: center; gap: .35rem;
    padding: .2rem .55rem; border-radius: 999px;
    font-size: .72rem; color: var(--text-secondary);
    border: 1px solid var(--line);
  }
  .tag {
    display: inline-block; padding: .3rem .7rem; border-radius: 999px;
    font-size: .8rem; color: var(--text-secondary);
    background: var(--surface);
  }

  /* ── Панель посуды ── */
  .vessel { padding: .75rem .95rem; border-radius: 16px; }
  .vessel-body { display: flex; flex-wrap: wrap; align-items: center; gap: .8rem 1.6rem; }
  .vessel-left { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: .6rem; }
  .vessel-line { display: flex; align-items: center; gap: .75rem; }
  .vessel-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted); }
  .vol-field { display: flex; align-items: center; gap: .35rem; font-size: .85rem; color: var(--text-secondary); }
  .vol-field input { width: 4.2rem; text-align: right; padding: .35rem .55rem; font-size: .95rem; }
  .vessel-range { flex: 1 1 auto; min-width: 120px; }
  .vessel-presets { display: flex; flex-wrap: wrap; gap: .35rem; }
  .vessel-mat { display: flex; align-items: center; gap: .5rem; flex: 0 0 auto; margin-left: auto; }
  .vessel-mat .seg button { padding: .65rem 1.1rem; font-size: .86rem; }
  .vessel-summary { display: none; width: 100%; align-items: center; gap: .6rem; min-height: 2.5rem; text-align: left; color: var(--text); }
  .vessel-sum { font-size: .95rem; }
  .vessel-edit { margin-left: auto; color: var(--accent); font-size: 1rem; }
  .vessel-edit::before { content: '✎'; }
  .vessel-summary[aria-expanded="true"] .vessel-edit::before { content: '✕'; }
  @media (max-width: 639px) {
    .vessel-summary { display: flex; }
    .vessel-body { display: none; margin-top: .8rem; flex-direction: column; align-items: stretch; }
    .vessel.open .vessel-body { display: flex; }
    .vessel-left { flex: none; }
    .vessel-mat { width: 100%; margin-left: 0; }
    .vessel-mat .seg { flex: 1; }
    .vessel-mat .seg button { padding: .5rem .6rem; font-size: .8rem; }
  }

  .seg { display: grid; grid-template-columns: 1fr 1fr; padding: 3px; border-radius: 12px; background: var(--bg); border: 1px solid var(--line); }
  .seg button {
    padding: .45rem .75rem; border-radius: 9px; font-size: .8rem; color: var(--text-secondary); white-space: nowrap;
    transition: color .2s, background-color .2s;
  }
  .seg button:hover { color: var(--text); }
  .seg button[aria-pressed="true"] { color: var(--text); background: var(--surface-active); }

  .preset {
    padding: .3rem .55rem; border-radius: 9px; font-size: .75rem;
    font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums;
    color: var(--text-secondary); border: 1px solid var(--line); background: transparent;
    transition: color .2s, border-color .2s, background-color .2s;
  }
  .preset:hover { color: var(--text); border-color: var(--line-strong); background: var(--surface-hover); }
  .preset[aria-pressed="true"] { color: var(--accent-light); background: var(--accent-soft); border-color: var(--line-accent); }

  /* Подсказка ⓘ */
  .info { position: relative; display: inline-flex; }
  .info-btn {
    width: 2rem; height: 2rem; border-radius: 999px; font-size: 1rem; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-muted); border: 1px solid transparent;
    transition: color .2s, background-color .2s, border-color .2s;
  }
  .info-btn:hover, .info-btn[aria-expanded="true"] { color: var(--accent); background: var(--surface-hover); border-color: var(--line); }
  .info-pop {
    display: none; position: absolute; top: calc(100% + 8px); right: 0; z-index: 35;
    width: min(290px, calc(100vw - 32px)); padding: .8rem .9rem; border-radius: 12px;
    background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-soft);
    font-size: .8rem; line-height: 1.5; color: var(--text-secondary);
  }
  .info-pop p + p { margin-top: .45rem; }
  .info-pop b { color: var(--text); font-weight: 500; }
  .info-pop .info-warn { color: var(--warning); }
  .info.open .info-pop, .info-btn:focus-visible + .info-pop { display: block; }
  @media (hover: hover) { .info:hover .info-pop { display: block; } }

  /* ── Range ── */
  input[type="range"].range {
    -webkit-appearance: none; appearance: none; width: 100%; height: 24px; background: transparent; cursor: pointer;
  }
  input[type="range"].range::-webkit-slider-runnable-track {
    height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, var(--accent) 0%, var(--accent) var(--pct, 15%), var(--line-strong) var(--pct, 15%));
  }
  input[type="range"].range::-moz-range-track { height: 3px; border-radius: 3px; background: var(--line-strong); }
  input[type="range"].range::-moz-range-progress { height: 3px; border-radius: 3px; background: var(--accent); }
  input[type="range"].range::-webkit-slider-thumb {
    -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; margin-top: -6.5px;
    background: var(--accent-light); border: 3px solid var(--bg-secondary); box-shadow: 0 0 0 1px var(--line-accent);
  }
  input[type="range"].range::-moz-range-thumb {
    width: 12px; height: 12px; border-radius: 50%; background: var(--accent-light); border: 3px solid var(--bg-secondary);
  }

  .field {
    background: var(--bg); border: 1px solid var(--line-strong); border-radius: 10px;
    color: var(--text); outline: none; transition: border-color .2s, background-color .2s;
  }
  .field:focus { border-color: var(--line-accent); }
  .field::placeholder { color: var(--text-muted); }
  input[type="number"].field::-webkit-inner-spin-button, input[type="number"].field::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"].field { -moz-appearance: textfield; }
  input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }

  /* ── Каталог ── */
  .cat-in { animation: catIn .22s var(--ease) backwards; }
  @keyframes catIn { from { opacity: 0; transform: translateY(6px); } }
  .cat-head { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: .6rem 1rem; margin: .2rem 0 .85rem; }
  .cat-head-title { font-size: 1.7rem; line-height: 1.1; font-weight: 600; color: var(--text); }
  .cat-grid, .tea-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: .7rem; }
  @media (min-width: 460px) { .cat-grid, .tea-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1280px) { .cat-grid, .tea-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .cat-card {
    position: relative; overflow: hidden; text-align: left;
    display: flex; flex-direction: column; gap: .25rem;
    min-height: 150px; padding: 1.05rem 1.1rem 1rem; border-radius: 18px;
    background: linear-gradient(150deg, var(--cbg) 0%, var(--surface) 78%);
    border: 1px solid var(--line); box-shadow: var(--shadow-card);
    transition: border-color .22s, box-shadow .22s, transform .22s var(--ease);
  }
  .cat-card::before {
    content: ''; position: absolute; left: 1.1rem; top: 0; width: 28px; height: 2px;
    border-radius: 0 0 2px 2px; background: var(--c); opacity: .85;
  }
  .cat-card:hover { border-color: var(--line-strong); box-shadow: var(--shadow-soft); transform: translateY(-1px); }
  .cat-card:active { transform: none; }
  .cat-card.has-selected { border-color: color-mix(in srgb, var(--c) 38%, transparent); }
  .cat-glyph {
    position: absolute; right: .5rem; bottom: -1.15rem; font-size: 6.4rem; line-height: 1;
    color: var(--c); opacity: .26; pointer-events: none;
    transition: opacity .22s, transform .22s var(--ease);
  }
  .cat-card:hover .cat-glyph { opacity: .34; transform: translateY(-2px); }
  .cat-count {
    align-self: flex-start; display: inline-flex; align-items: center; gap: .35rem;
    margin-bottom: .45rem; padding: .16rem .55rem; border-radius: 999px;
    font-size: .7rem; color: var(--text-secondary);
    background: rgba(17, 23, 20, 0.5); border: 1px solid var(--line);
  }
  .cat-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .cat-title { position: relative; font-size: 1.5rem; line-height: 1.1; font-weight: 600; color: var(--text); padding-right: 3rem; }
  .cat-desc { position: relative; font-size: .84rem; line-height: 1.45; color: var(--text-secondary); padding-right: 2.5rem; }
  .cat-desc .mono { color: var(--text-muted); font-size: .78rem; white-space: nowrap; }

  .cat-banner {
    position: relative; overflow: hidden; display: flex; align-items: center; gap: 1rem;
    padding: .9rem 1.1rem; border-radius: 16px; margin-bottom: .9rem;
    background: linear-gradient(150deg, var(--cbg) 0%, var(--surface) 80%);
    border: 1px solid var(--line);
  }
  .cat-banner .hz { font-size: 2.6rem; line-height: 1; color: var(--c); opacity: .75; }
  .cat-banner h2 { font-size: 1.65rem; line-height: 1.1; font-weight: 600; }
  .cat-banner p { font-size: .82rem; color: var(--text-secondary); margin-top: .15rem; }

  .btn-back {
    display: inline-flex; align-items: center; gap: .45rem;
    padding: .5rem .9rem .5rem .75rem; border-radius: 999px; font-size: .85rem;
    color: var(--text-secondary); background: var(--surface); border: 1px solid var(--line);
    transition: color .2s, background-color .2s, border-color .2s;
  }
  .btn-back:hover { color: var(--text); background: var(--surface-hover); border-color: var(--line-strong); }
  .btn-link { font-size: .85rem; color: var(--accent); text-underline-offset: 3px; transition: color .2s; }
  .btn-link:hover { color: var(--accent-hover); text-decoration: underline; }
  .group-title {
    display: flex; align-items: center; gap: .5rem; margin: 1.1rem 0 .55rem;
    font-size: .7rem; text-transform: uppercase; letter-spacing: .14em; color: var(--text-muted);
  }
  .group-title:first-child { margin-top: 0; }
  .group-title .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }

  /* ── Карточки сортов ── */
  .tea-card {
    position: relative; text-align: left; display: flex; flex-direction: column;
    min-height: 104px; padding: .8rem 2.5rem .75rem 1rem; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--line);
    transition: background-color .2s, border-color .2s;
  }
  .tea-card::before {
    content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
    border-radius: 0 3px 3px 0; background: var(--c); opacity: 0; transition: opacity .2s;
  }
  .tea-card:hover { background: var(--surface-hover); border-color: var(--line-strong); }
  .tea-card.selected { background: color-mix(in srgb, var(--surface-active) 55%, var(--surface)); border-color: var(--line-strong); }
  .tea-card.selected::before { opacity: 1; }
  .curve-ico { position: absolute; top: .75rem; right: .8rem; display: inline-flex; font-size: 1rem; color: var(--text-muted); transition: color .2s; }
  .tea-card:hover .curve-ico, .tea-card.selected .curve-ico { color: var(--text-secondary); }
  .tea-name { font-size: 1.26rem; line-height: 1.12; font-weight: 600; color: var(--text); }
  .tea-sub { font-size: .8rem; line-height: 1.35; color: var(--text-secondary); margin-top: .2rem; }
  .tea-meta { display: flex; align-items: baseline; gap: .45rem; margin-top: auto; padding-top: .65rem; font-size: .92rem; }
  .tea-meta .g { color: var(--accent); }
  .tea-meta .sep { color: var(--text-muted); }
  .tea-meta .t { color: var(--text); }

  .empty { border-radius: 18px; padding: 2.5rem 1.5rem; text-align: center; }

  /* ── Панель деталей / мобильная шторка ── */
  #detail { border-radius: 20px; }
  @media (max-width: 1023px) {
    #detail {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
      max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
      border-radius: 22px 22px 0 0;
      background: var(--bg-secondary);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.35);
      transform: translateY(105%);
      transition: transform .45s var(--ease);
      padding-bottom: calc(1.25rem + env(safe-area-inset-bottom));
    }
    #detail.open { transform: none; }
  }
  @media (min-width: 1024px) {
    #detail { position: sticky; top: 84px; max-height: calc(100vh - 104px); overflow-y: auto; }
  }
  .sheet-handle { width: 42px; height: 4px; border-radius: 4px; background: var(--line-strong); margin: -0.25rem auto 0.9rem; }
  .backdrop {
    position: fixed; inset: 0; z-index: 55; background: rgba(8, 11, 9, 0.62);
    opacity: 0; pointer-events: none; transition: opacity .3s;
  }
  .backdrop.show { opacity: 1; pointer-events: auto; }

  .section-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .16em; color: var(--text-muted); }
  .dose { border-radius: 16px; padding: .9rem 1rem; background: var(--surface); border: 1px solid var(--line); }
  .dose-main { display: flex; flex-wrap: wrap; align-items: baseline; gap: .3rem 1.4rem; margin-top: .3rem; }
  .dose-main > div { display: flex; align-items: baseline; gap: .5rem; }
  .dose-k { font-family: 'Cormorant Garamond', Georgia, serif; font-size: 1.35rem; font-weight: 600; color: var(--text); }
  .dose-v { font-size: 1.6rem; line-height: 1; color: var(--accent); }
  .dose-meta { margin-top: .5rem; font-size: .78rem; line-height: 1.45; color: var(--text-secondary); }

  .specs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .35rem; }
  .specs > div { padding: .45rem .55rem; border-radius: 10px; background: var(--surface); min-width: 0; }
  .specs dt { font-size: .6rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .specs dd { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: .82rem; color: var(--text); margin-top: .1rem; }

  .stat { padding: .6rem .7rem; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .stat .k { font-size: .66rem; text-transform: uppercase; letter-spacing: .12em; color: var(--text-muted); }
  .stat .v { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-size: .95rem; margin-top: .15rem; color: var(--text); }

  .plaque {
    display: flex; gap: .6rem; align-items: flex-start;
    padding: .65rem .85rem; border-radius: 12px; font-size: .84rem; line-height: 1.4; color: var(--text);
  }
  .plaque.lid { background: color-mix(in srgb, var(--info) 9%, transparent); border: 1px solid color-mix(in srgb, var(--info) 26%, transparent); }
  .plaque.lid .ico { color: var(--info); }
  .plaque.warn { background: color-mix(in srgb, var(--warning) 9%, transparent); border: 1px solid color-mix(in srgb, var(--warning) 32%, transparent); }
  .plaque.warn .ico { color: var(--warning); }
  .plaque .ico { width: 1.1rem; height: 1.1rem; margin-top: .05rem; }

  .tip {

   4. МАТЕМАТИЧЕСКОЕ ЯДРО
   ════════════════════════════════════════════════════════════════════ */
const CLAY_BONUS = 0.5;
const VOLUME_MIN = 50, VOLUME_MAX = 400;
const VOLUME_PRESETS = [80, 100, 130, 160, 200];
const MATERIALS = {
  porcelain: { name: 'Фарфор / Стекло', note: 'Гайвань: нейтральная теплоотдача — базовые параметры без изменений.' },
  clay:      { name: 'Исинская глина',  note: 'Толстые пористые стенки долго держат жар. +0.5 г к навеске: поры глины забирают часть аромата.' }
};
const CLAY_WARNING = 'Глина слишком долго держит жар! Для чая с водой до 85°C лучше взять фарфор или не закрывать крышку';
const LID_WARNING = 'Держите крышку гайвани приоткрытой между проливами';
const MIN_STEEP_SEC = 3;

/** Итоговый вес (г) = round((V/100 × grams_per_100ml) + clay_bonus, 1) */
function calcGrams(tea, volume, material) {
  const bonus = material === 'clay' ? CLAY_BONUS : 0;
  return Math.round(((volume / 100) * tea.grams_per_100ml + bonus) * 10) / 10;
}

/** Температура для показа: «80» или диапазон «70–75» */
const tempText = t => (t.temp_max && t.temp_max > t.temp_c) ? `${t.temp_c}–${t.temp_max}` : `${t.temp_c}`;

/** Тайминги проливов берутся из готового массива steep_times (секунды), без формул */
function generateSteepTimes(tea) {
  return tea.steep_times.slice();
}

/** Только для миграции: старые «свои» сорта хранили base_sec/step_sec/curve_type — переводим их в массив один раз */
function legacySteepTimes(raw) {
  const B = Number(raw.base_sec), S = Number(raw.step_sec) || 0, out = [];
  const n = Math.min(30, Math.max(1, Math.round(Number(raw.max_steeps)) || 8));
  for (let i = 1; i <= n; i++) {
    const prev = out[i - 2];
    let t;
    switch (raw.curve_type) {
      case 'pressed':
        if (i === 1)      t = B;
        else if (i === 2) t = Math.max(5, Math.round(B * 0.7));
        else if (i === 3) t = Math.max(6, Math.round(B * 0.8));
        else if (i === 4) t = B + S;
        else {
          t = prev + Math.round(S * Math.pow(1.4, i - 4));
          if (t > 40) t = Math.round(t / 5) * 5;
        }
        break;
      case 'rolled':
        if (i === 1 || i === 3) t = B;
        else if (i === 2)       t = Math.max(5, B - 5);
        else                    t = B + (i - 3) * S;
        break;
      default: // loose
        t = i <= 4 ? B + (i - 1) * S : prev + Math.round(S * 1.3);
    }
    out.push(t);
  }
  return out;
}

/* ════════════════════════════════════════════════════════════════════
   5. ЗВУКОВОЙ ДВИЖОК (Web Audio API)
   ════════════════════════════════════════════════════════════════════ */
class SoundEngine {
  constructor(muted) {
    this.ctx = null;
    this.master = null;
    this.muted = !!muted;
  }
  ensure() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      this.ctx = new AC();
      this.master = this.ctx.createGain();
      this.master.gain.value = this.muted ? 0 : 0.9;
      this.master.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  }
  setMuted(m) {
    this.muted = m;
    if (this.ctx) this.master.gain.setTargetAtTime(m ? 0 : 0.9, this.ctx.currentTime, 0.05);
  }
  _ready() { return this.muted ? null : this.ensure(); }

  _voice(ctx, { type = 'sine', freq, freqEnd, detune = 0, peak, attack, decay, at, dest }) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, at);
    if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, at + decay * 0.5);
    o.detune.value = detune;
    g.gain.setValueAtTime(0.0001, at);
    g.gain.exponentialRampToValueAtTime(peak, at + attack);
    g.gain.exponentialRampToValueAtTime(0.0001, at + attack + decay);
    o.connect(g); g.connect(dest || this.master);
    o.start(at); o.stop(at + attack + decay + 0.05);
  }

  /** Старт пролива: капля воды + мягкий деревянный клик */
  click() {
    const ctx = this._ready(); if (!ctx) return;
    const t = ctx.currentTime + 0.005;
    this._voice(ctx, { freq: 1300, freqEnd: 420, peak: 0.28, attack: 0.006, decay: 0.17, at: t });
    this._voice(ctx, { type: 'triangle', freq: 190, freqEnd: 140, peak: 0.12, attack: 0.003, decay: 0.08, at: t });
  }

  /** Предупреждение за 2 секунды: тихий высокий обертон */
  warn() {
    const ctx = this._ready(); if (!ctx) return;
    const t = ctx.currentTime + 0.005;
    this._voice(ctx, { freq: 1760, peak: 0.06, attack: 0.01, decay: 0.9, at: t });
    this._voice(ctx, { freq: 2640, detune: 4, peak: 0.025, attack: 0.01, decay: 0.6, at: t });
  }

  /** Финал пролива: поющая чаша, 3.5 с экспоненциального затухания */
  gong() {
    const ctx = this._ready(); if (!ctx) return;
    const t = ctx.currentTime + 0.01, dur = 3.5;
    const bus = ctx.createGain();
    bus.gain.value = 0.85;
    bus.connect(this.master);
    const partials = [
      { type: 'sine',     freq: 432,  detune: 0,  peak: 0.26, decay: dur },
      { type: 'sine',     freq: 432,  detune: 7,  peak: 0.10, decay: dur },        // биение «поющей чаши»
      { type: 'triangle', freq: 648,  detune: -5, peak: 0.07, decay: dur * 0.85 },
      { type: 'sine',     freq: 864,  detune: 6,  peak: 0.09, decay: dur * 0.75 },
      { type: 'sine',     freq: 1296, detune: -8, peak: 0.025, decay: dur * 0.45 }
    ];
    partials.forEach(p => this._voice(ctx, { ...p, attack: 0.012, decay: p.decay - 0.012, at: t, dest: bus }));
  }
}

/* ════════════════════════════════════════════════════════════════════
   6b. СВОИ ЧАИ И ПРАВКИ БАЗЫ
   Правки встроенных сортов хранятся отдельно (только изменённые поля),
   поэтому «Сбросить к стандарту» всегда возвращает исходные значения.
   ════════════════════════════════════════════════════════════════════ */
const CATEGORY_COUNTS = {};
const SEARCH_INDEX = {};
const compactText = s => s.replace(/[\s'’\-()/·.,«»—]+/g, '');

const TEA_DEFAULTS = {
  temp_c: 90, grams_per_100ml: 5, needs_rinse: true, rinse_sec: 5, warm_breath_sec: 30,
  steep_times: [10, 12, 15, 20, 30, 45, 60, 90], max_steeps: 8, open_lid_warning: false, flavor_tags: [], brewing_tip: ''
};
const LIMITS = {
  temp_c: [60, 100], temp_max: [60, 100], grams_per_100ml: [1, 15], rinse_sec: [1, 60], warm_breath_sec: [0, 120],
  steep_sec: [1, 600], steep_count: [1, 30]
};
const FIELD_LABELS = {
  temp_c: 'Температура', temp_max: 'Температура «до»', grams_per_100ml: 'Граммовка на 100 мл',
  rinse_sec: 'Время промывки', warm_breath_sec: 'Время прогрева'
};
// Прежняя категория «Пуэры и Хэй Ча» разделилась; остальные идентификаторы сохранены
const LEGACY_CATEGORY = { puerh_heicha: 'shu_puer' };

function clampNum(v, [lo, hi], decimals = 0) {
  if (v === '' || v == null) return null;
  v = Number(v);
  if (!Number.isFinite(v)) return null;
  v = Math.min(hi, Math.max(lo, v));
  return decimals ? Math.round(v * 10) / 10 : Math.round(v);
}

/** Оставляет только допустимые редактируемые поля и приводит их к границам */
function cleanFields(raw) {
  const o = {};
  if (!raw || typeof raw !== 'object') return o;
  for (const k of ['temp_c', 'rinse_sec', 'warm_breath_sec']) {
    const v = clampNum(raw[k], LIMITS[k]);
    if (v !== null) o[k] = v;
  }
  if (raw.temp_max === null) o.temp_max = null;
  else { const v = clampNum(raw.temp_max, LIMITS.temp_max); if (v !== null) o.temp_max = v; }
  const g = clampNum(raw.grams_per_100ml, LIMITS.grams_per_100ml, 1);
  if (g !== null) o.grams_per_100ml = g;
  for (const k of ['needs_rinse', 'open_lid_warning']) if (typeof raw[k] === 'boolean') o[k] = raw[k];
  if (Array.isArray(raw.steep_times)) {
    const arr = raw.steep_times.map(x => clampNum(x, LIMITS.steep_sec)).filter(x => x !== null).slice(0, LIMITS.steep_count[1]);
    if (arr.length) { o.steep_times = arr; o.max_steeps = arr.length; }
  }
  if (Array.isArray(raw.flavor_tags)) o.flavor_tags = raw.flavor_tags.map(s => String(s).trim()).filter(Boolean).slice(0, 8);
  if (typeof raw.brewing_tip === 'string') o.brewing_tip = raw.brewing_tip.trim().slice(0, 600);
  return o;
}

function normalizeCustom(raw) {
  if (!raw || typeof raw.id !== 'string') return null;
  const categoryId = LEGACY_CATEGORY[raw.categoryId] || raw.categoryId;
  if (!CAT[categoryId]) return null;
  const name = String(raw.name_ru || '').trim().slice(0, 80);
  if (!name) return null;
  // Старый формат (до перехода на таблицы проливов): base_sec/step_sec/curve_type → steep_times
  const legacy = !Array.isArray(raw.steep_times) && Number.isFinite(Number(raw.base_sec));
  return {
    ...TEA_DEFAULTS, ...cleanFields(legacy ? { ...raw, steep_times: legacySteepTimes(raw) } : raw),
    id: raw.id, name_ru: name, name_cn: String(raw.name_cn || '').trim().slice(0, 60),
    categoryId, categoryName: CAT[categoryId].short, custom: true
  };
}

let customTeas = [];
let overrides = {};
{
  const c = store.get(KEYS.customTeas, []);
  if (Array.isArray(c)) customTeas = c.map(normalizeCustom).filter(Boolean);
  const o = store.get(KEYS.overrides, {});
  if (o && typeof o === 'object' && !Array.isArray(o)) {
    for (const t of TEA_DATABASE) {
      const f = cleanFields(o[t.id]);
      if (Object.keys(f).length) overrides[t.id] = f;
    }
  }
}
const saveCustomTeas = () => store.set(KEYS.customTeas, customTeas);
const saveOverrides = () => store.set(KEYS.overrides, overrides);

let favorites = [];
{
  const f = store.get(KEYS.favorites, []);
  if (Array.isArray(f)) favorites = [...new Set(f.filter(x => typeof x === 'string'))];
}
const saveFavorites = () => store.set(KEYS.favorites, favorites);

/** Единственное место, где собирается рабочий список чаёв и производные индексы */
function rebuildTeas() {
  TEAS = TEA_DATABASE.map(t => overrides[t.id] ? { ...t, ...overrides[t.id], modified: true } : t).concat(customTeas);
  for (const m of [TEA_BY_ID, CATEGORY_COUNTS, SEARCH_INDEX]) for (const k of Object.keys(m)) delete m[k];
  for (const t of TEAS) {
    TEA_BY_ID[t.id] = t;
    CATEGORY_COUNTS[t.categoryId] = (CATEGORY_COUNTS[t.categoryId] || 0) + 1;
    const hay = norm([
      t.name_ru, t.name_cn, t.id.replace(/-/g, ' '), t.categoryName, CAT[t.categoryId].short,
      ...t.flavor_tags, t.brewing_tip
    ].join(' '));
    SEARCH_INDEX[t.id] = { hay, compact: compactText(hay) };
  }
}
rebuildTeas();

/** Читает дневник; повреждённые записи и неверный формат хранилища не должны ломать приложение */
function loadLog() {
  const raw = store.get(KEYS.log, []);
  if (!Array.isArray(raw)) return [];
  return raw
    .filter(e => e && typeof e === 'object' && typeof e.id === 'string' && typeof e.teaId === 'string' &&
                 typeof e.teaName === 'string' && Number.isFinite(e.grams) && Number.isFinite(e.volume) && Array.isArray(e.steepTimes))
    .map(e => ({ categoryId: '', material: 'porcelain', steepsDone: 0, totalSteeps: e.steepTimes.length, adjustTotal: 0, rating: 0, qi: [], note: '', date: new Date(0).toISOString(), ...e }));
}

  session: null,

/* ════════════════════════════════════════════════════════════════════
   7. УТИЛИТЫ
   ════════════════════════════════════════════════════════════════════ */
const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const pad = n => String(n).padStart(2, '0');
const RING_C = 2 * Math.PI * 90;

function clampVolume(v) {
  v = Math.round(Number(v));
  if (!Number.isFinite(v)) return 100;
  return Math.min(VOLUME_MAX, Math.max(VOLUME_MIN, v));
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function norm(s) {
  // нижний регистр, без диакритики; ё=е=э, ь/ъ отбрасываются: «шен»=«шэн», «хуан»=«хуань», «дан»=«дань»
  return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[её]/g, 'е').replace(/э/g, 'е').replace(/[ьъ]/g, '');
}
/** «Шу Пуэр (Прессованный блин)» → ['Шу Пуэр', 'Прессованный блин'] */
function splitParen(s) {
  const m = String(s).match(/^(.*?)\s*\((.*)\)\s*$/);
  return m ? [m[1], m[2]] : [s, ''];
}
function fmtSec(s) {
  return s < 60 ? `${s}с` : `${Math.floor(s / 60)}:${pad(s % 60)}`;
}
function fmtLongSec(s) {
  return s < 60 ? `${s} с` : `${Math.floor(s / 60)} мин ${pad(s % 60)} с`;
}
function fmtClock(ms) {
  if (ms >= 60000) {
    const s = Math.ceil(ms / 1000);
    return `${pad(Math.floor(s / 60))}:${pad(s % 60)}`;
  }
  return (Math.max(0, ms) / 1000).toFixed(1).padStart(4, '0');
}
function fmtDuration(totalSec) {
  if (totalSec < 60) return `${totalSec} с`;
  const m = Math.round(totalSec / 60);
  return m < 60 ? `≈ ${m} мин` : `≈ ${Math.floor(m / 60)} ч ${pad(m % 60)} мин`;
}
function pluralRu(n, one, few, many) {
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return one;
  if (m10 >= 2 && m10 <= 4 && (m100 < 12 || m100 > 14)) return few;
  return many;
}
function isTypingTarget(el) {
  return !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName));
}

let toastTimer = null;
function toast(msg, ms = 3000) {
  const el = $('#toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), ms);
}

function updateVesselUI() {

}

const sortsLabel = n => `${n} ${pluralRu(n, 'сорт', 'сорта', 'сортов')}`;

/** Глобальный поиск по всей базе — не зависит от открытой категории */
function searchTeas(query) {
  const words = norm(query).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  return TEAS.filter(t => {
    const ix = SEARCH_INDEX[t.id];
    return words.every(w => ix.hay.includes(w) || ix.compact.includes(compactText(w)));
  });
}

function teaCardHTML(t) {
  const c = CAT[t.categoryId];
  const g = calcGrams(t, state.volume, state.material);

  const fav = favorites.includes(t.id);
  const favLabel = `${fav ? 'Убрать из избранного' : 'Добавить в избранное'}: ${main}`;
  return `
    <div class="tea-item">

      </button>
      <button type="button" class="fav-btn" data-action="toggle-fav" data-id="${t.id}" aria-pressed="${fav}" aria-label="${favLabel}" title="${fav ? 'Убрать из избранного' : 'Добавить в избранное'}">${fav ? ICON.starFill : ICON.star}</button>
    </div>`;

const FAV_PREVIEW = 6;
const favoriteTeas = () => favorites.map(id => TEA_BY_ID[id]).filter(Boolean);

function favoritesSectionHTML() {
  const list = favoriteTeas();

function toggleFavorite(id) {

function curveChartHTML(tea, times) {
  const items = [];
  if (tea.needs_rinse) items.push({ sec: tea.rinse_sec, label: 'П', rinse: true });
  times.forEach((s, i) => items.push({ sec: s, label: String(i + 1), dip: i > 0 && s < times[i - 1] }));
  const max = Math.max(...items.map(x => x.sec));
  // √-шкала — чтобы просадки на ранних проливах оставались видны даже рядом с длинными поздними
  return `<div class="chart ${items.length > 12 ? 'dense' : ''}" role="img" aria-label="Кривая проливов: ${times.join(', ')} секунд">
    ${items.map((x, i) => {
      const h = Math.max(6, Math.sqrt(x.sec / max) * 100);
      return `<div class="col">
        <div class="bar ${x.rinse ? 'rinse' : ''} ${x.dip ? 'dip' : ''}" style="height:${h}%; animation-delay:${i * 35}ms">
          <span class="val">${fmtSec(x.sec)}</span>
        </div>
        <span class="idx">${x.label}</span>
      </div>`;
    }).join('')}
  </div>`;
}

/* ════════════════════════════════════════════════════════════════════
   9. ЭКРАН 2 — СЕССИЯ (STATE MACHINE)
   ════════════════════════════════════════════════════════════════════ */
function buildSteps(tea, steepTimes) {
  const steps = [];
  if (tea.needs_rinse && tea.rinse_sec > 0) steps.push({ kind: 'rinse', sec: tea.rinse_sec });
  if (tea.warm_breath_sec > 0) steps.push({ kind: 'breath', sec: tea.warm_breath_sec });
  steepTimes.forEach((sec, i) => steps.push({ kind: 'steep', n: i + 1, sec }));
  return steps;
}

function sessionHasProgress() {
  const s = state.session;
  return !!s && (s.completed.length > 0 || s.running || s.remainingMs < s.steps[s.idx].sec * 1000);
}

function startSession(tea, opts = {}) {
  if (sessionHasProgress() && !confirm('Текущее чаепитие ещё не завершено. Начать новую церемонию? Несохранённый прогресс будет потерян.')) return;
  const times = Array.isArray(opts.steepTimes) && opts.steepTimes.length ? opts.steepTimes.slice() : generateSteepTimes(tea);
  const steps = buildSteps(tea, times);
  state.session = {
    teaId: tea.id,
    volume: state.volume,
    material: state.material,
    grams: calcGrams(tea, state.volume, state.material),
    steps,
    idx: 0,
    completed: [],
    finished: false,
    startedAt: Date.now(),
    adjustTotal: 0,
    running: false,
    endAt: 0,
    remainingMs: steps[0].sec * 1000,
    warned: false
  };
  persistSession();
  closeSheet();
  sound.ensure();
  showScreen('session');
  toast(`Отмерьте ${state.session.grams.toFixed(1)} г и нагрейте воду до ${tempText(tea)}°C`);
}

function persistSession() {
  const s = state.session;
  if (!s) { store.remove(KEYS.session); return; }
  const { teaId, volume, material, grams, steps, idx, completed, finished, startedAt, adjustTotal } = s;
  store.set(KEYS.session, { teaId, volume, material, grams, steps, idx, completed, finished, startedAt, adjustTotal });
}

function restoreSession() {
  const d = store.get(KEYS.session, null);
  if (!d || !TEA_BY_ID[d.teaId] || !Array.isArray(d.steps) || !d.steps.length ||
      !d.steps.every(x => x && ['rinse', 'breath', 'steep'].includes(x.kind) && Number.isFinite(x.sec))) return;
  const idx = Math.min(Math.max(0, d.idx | 0), d.steps.length - 1);
  state.session = {
    ...d, idx,
    completed: Array.isArray(d.completed) ? d.completed : [],
    adjustTotal: d.adjustTotal || 0,
    running: false, endAt: 0, warned: false,
    remainingMs: d.finished ? 0 : d.steps[idx].sec * 1000
  };
}

function curStep() { const s = state.session; return s ? s.steps[s.idx] : null; }

function startTimer(silent = false) {
  const s = state.session;
  if (!s || s.finished || s.running) return;
  if (s.remainingMs <= 0) s.remainingMs = curStep().sec * 1000;
  if (s.remainingMs > 2050) s.warned = false;
  s.endAt = performance.now() + s.remainingMs;
  s.running = true;
  if (silent) sound.ensure(); else sound.click();
  updateTimerUI(true);
  updateNav();
}

function pauseTimer() {
  const s = state.session;
  if (!s || !s.running) return;
  s.remainingMs = Math.max(0, s.endAt - performance.now());
  s.running = false;
  updateTimerUI(true);
  updateNav();
}

function toggleTimer() {
  const s = state.session;
  if (!s) return;
  if (s.finished) { toast('Церемония завершена. Сохраните её в дневник или выберите пролив на ленте.'); return; }
  s.running ? pauseTimer() : startTimer();
}

function resetStep() {
  const s = state.session;
  if (!s) return;
  s.running = false;
  s.finished = false;
  s.remainingMs = curStep().sec * 1000;
  s.warned = false;
  renderSession();
  updateNav();
}

function goToStep(i) {
  const s = state.session;
  if (!s || i < 0 || i >= s.steps.length) return;
  s.running = false;
  s.finished = false;
  s.idx = i;
  s.remainingMs = s.steps[i].sec * 1000;
  s.warned = false;
  persistSession();
  renderSession();
  updateNav();
}

/** Пропуск подготовительного шага (промывка / прогрев). goToStep останавливает таймер; новый шаг сам не стартует */
function skipStep() {
  const s = state.session;
  if (!s || s.finished) return;
  const step = curStep();
  if (step.kind === 'breath') {
    // прежнее поведение: прогрев отмечается пройденным
    if (!s.completed.includes(s.idx)) s.completed.push(s.idx);
    goToStep(s.idx + 1);
    toast('Переходим к 1-му проливу');
  } else if (step.kind === 'rinse') {
    // пропущенная промывка не отмечается выполненной
    goToStep(s.idx + 1);
    toast(curStep().kind === 'breath' ? 'Промывка пропущена — прогрев листа' : 'Промывка пропущена — заливайте 1-й пролив');
  }
}

/** Действия под таймером зависят от step.kind: оценка крепости — только для проливов */
function stepActionsHTML(s, step, remainingSteeps) {
  if (!s.finished && step.kind === 'rinse') {
    return `
      <div class="flex flex-col items-center gap-1.5">
        <button type="button" class="btn-ghost" data-action="skip-step">${ICON.skip}<span>Пропустить промывку</span></button>
        <span class="text-[12px] text-dim text-center">Воду после промывки сливают — этот настой не пьют</span>
      </div>`;
  }
  if (!s.finished && step.kind === 'breath') {
    return `<button type="button" class="btn-ghost" data-action="skip-step" aria-label="Пропустить прогрев и перейти к 1-му проливу">${ICON.skip}<span>Пропустить прогрев</span></button>`;
  }
  const dis = remainingSteeps && !s.finished ? '' : 'disabled';
  return `
    <div class="flex flex-wrap items-center justify-center gap-2">
      <button type="button" class="adj" data-action="adjust" data-delta="-3" ${dis}>Крепковато <b>−3с</b></button>
      <button type="button" class="adj" data-action="adjust" data-delta="5" ${dis}>Слабовато <b>+5с</b></button>
    </div>`;
}

function completeStep() {
  const s = state.session;
  const step = curStep();
  s.running = false;
  s.remainingMs = 0;
  if (!s.completed.includes(s.idx)) s.completed.push(s.idx);
  sound.gong();
  if (navigator.vibrate) { try { navigator.vibrate([180, 90, 180]); } catch {} }

  const nextIdx = s.idx + 1;
  if (nextIdx >= s.steps.length) {
    s.finished = true;
    persistSession();
    renderSession();
    updateNav();
    toast('Последний пролив завершён. Спасибо листу 🍵', 4500);
    return;
  }
  s.idx = nextIdx;
  s.remainingMs = s.steps[nextIdx].sec * 1000;
  s.warned = false;
  const next = s.steps[nextIdx];
  persistSession();
  renderSession();

  if (step.kind === 'rinse') {
    if (next.kind === 'breath') {
      startTimer(true); // прогрев запускается автоматически
      toast('Слейте промывку. Лист «дышит» в горячей посуде');
    } else {
      toast('Слейте промывку. Заливайте 1-й пролив');
    }
  } else if (step.kind === 'breath') {
    toast(`Лист проснулся. Пролив 1 — ${fmtLongSec(next.sec)}`);
  } else {
    toast(`Сливайте настой! Далее пролив ${next.n} — ${fmtLongSec(next.sec)}`);
  }
  updateNav();
}

/** Живая коррекция: сдвигает текущий и все будущие проливы (минимум 3 с) */
function adjustCurve(delta) {
  const s = state.session;
  if (!s) return;
  const cur = curStep();
  const oldCurSec = cur.sec;
  let affected = 0;
  for (let j = s.idx; j < s.steps.length; j++) {
    const st = s.steps[j];
    if (st.kind !== 'steep') continue;
    if (j === s.idx && s.finished) continue;
    st.sec = Math.max(MIN_STEEP_SEC, st.sec + delta);
    affected++;
  }
  if (!affected) { toast('Не осталось проливов для коррекции'); return; }

  if (cur.kind === 'steep' && !s.finished) {
    const live = s.running ? Math.max(0, s.endAt - performance.now()) : s.remainingMs;
    const elapsed = Math.max(0, oldCurSec * 1000 - live);
    let remaining = cur.sec * 1000 - elapsed;
    if (elapsed > 0) remaining = Math.max(300, remaining);
    s.remainingMs = remaining;
    if (s.running) s.endAt = performance.now() + remaining;
    if (remaining > 2050) s.warned = false;
  }
  s.adjustTotal += delta;
  persistSession();
  renderSession();
  toast(`${delta < 0 ? 'Крепковато' : 'Слабовато'}: ${delta > 0 ? '+' : '−'}${Math.abs(delta)} с для ${affected} ${pluralRu(affected, 'пролива', 'проливов', 'проливов')}`);
}

function tick() {
  const s = state.session;
  if (!s || !s.running) return;
  s.remainingMs = Math.max(0, s.endAt - performance.now());
  const step = curStep();
  if (!s.warned && s.remainingMs <= 2000 && step.sec >= 4) {
    s.warned = true;
    sound.warn();
  }
  if (s.remainingMs <= 0) { completeStep(); return; }
  updateTimerUI();
  updateNav();
}

function stepTitle(s) {
  const step = s.steps[s.idx];
  const totalSteeps = s.steps.filter(x => x.kind === 'steep').length;
  if (s.finished) return { kicker: 'Все проливы позади', title: 'Церемония завершена' };
  if (step.kind === 'rinse') return { kicker: 'Нулевой пролив', title: 'Промывка листа' };
  if (step.kind === 'breath') return { kicker: 'Пауза после промывки', title: 'Прогрев дыханием' };
  return { kicker: `Пролив ${step.n} из ${totalSteeps}`, title: `${step.n}-й пролив` };
}

function stepHint(s, tea) {
  const step = s.steps[s.idx];
  if (s.finished) return 'Лист отдал всё, что мог. Сохраните впечатления в дневник.';
  if (step.kind === 'rinse') return 'Залейте воду и слейте через сито — пить этот настой не нужно';
  if (step.kind === 'breath') return 'Укутайте промытый лист в горячей посуде, вдохните аромат с крышки гайвани';
  const full = s.remainingMs >= step.sec * 1000;
  if (s.running) return 'Настаивается… За 2 секунды до гонга прозвучит тихий сигнал — берите гайвань в руки.';
  if (!full) return 'Пауза. Продолжите, когда будете готовы.';
  return `Залейте воду ${tempText(tea)}°C и нажмите «Старт». Сливайте настой по звуку гонга.`;
}

function renderSession() {
  const root = $('#screen-session');
  const s = state.session;
  if (!s) {
    root.innerHTML = `
      <div class="max-w-md mx-auto text-center panel rounded-[24px] p-10 screen-in">
        <div class="hz text-6xl accent opacity-70">静</div>
        <h2 class="serif text-3xl mt-4">Тишина перед чаем</h2>
        <p class="text-sage mt-2 text-sm">Активной сессии нет. Выберите чай в библиотеке и начните церемонию.</p>
        <button type="button" class="btn-primary mt-6" data-action="tab" data-tab="setup">Открыть библиотеку</button>
      </div>`;
    return;
  }
  const tea = TEA_BY_ID[s.teaId];
  const c = CAT[tea.categoryId];
  const step = curStep();
  const [main] = splitParen(tea.name_ru).map(escapeHtml);
  const [hz, py] = splitParen(tea.name_cn).map(escapeHtml);
  const clayWarn = s.material === 'clay' && tea.temp_c <= 85;
  const { kicker, title } = stepTitle(s);
  const remainingSteeps = s.steps.slice(s.idx).filter(x => x.kind === 'steep').length;
  const nextStep = s.steps[s.idx + 1];

  root.style.setProperty('--c', c.color);
  root.innerHTML = `
    <div class="max-w-3xl mx-auto flex flex-col items-center gap-3 sm:gap-4">
      <div class="w-full panel rounded-[20px] px-4 py-3 sm:px-5 sm:py-4 flex items-center justify-between gap-3">
        <div class="min-w-0 flex items-center gap-3">
          <button type="button" class="icon-btn !w-9 !h-9 shrink-0" data-action="tab" data-tab="setup" aria-label="В библиотеку">${ICON.back}</button>
          <div class="min-w-0">
            <div class="flex items-center gap-2 text-[11px] text-dim"><span class="inline-block w-1.5 h-1.5 rounded-full" style="background:${c.color}"></span>${c.short}</div>
            <h2 class="serif text-[1.45rem] sm:text-[1.9rem] leading-tight truncate font-semibold">${main}</h2>
            ${hz || py ? `<div class="text-[13px] text-sage truncate"><span class="hz text-ink">${hz}</span> <span class="italic">${py}</span></div>` : ''}
          </div>
        </div>

          ${ICON.cup}<span>Завершить чаепитие</span>
        </button>
      </div>
    </div>`;

  updateTimerUI(true);
  const tl = $('#timeline');
  const curEl = tl && tl.querySelector('.current');
  if (curEl) tl.scrollTo({ left: curEl.offsetLeft - tl.clientWidth / 2 + curEl.clientWidth / 2, behavior: 'smooth' });
}

function updateTimerUI(force = false) {
  const s = state.session;
  if (!s || state.screen !== 'session') { updateTitle(); return; }
  const digits = $('#timer-digits');
  if (!digits) return;
  const step = curStep();
  const total = step.sec * 1000;
  const rem = s.finished ? 0 : s.remainingMs;

  if (s.finished) {
    digits.textContent = '完';
    digits.classList.add('done');
    $('#timer-sub').textContent = 'завершено';
  } else {
    digits.textContent = fmtClock(rem);
    digits.classList.remove('done');
    $('#timer-sub').textContent = `из ${fmtLongSec(step.sec)}`;
  }
  $('#ring').setAttribute('stroke-dashoffset', (RING_C * (1 - (s.finished ? 0 : rem / total))).toFixed(2));

  const wrap = $('#timer-wrap');
  wrap.classList.toggle('running', s.running);
  wrap.classList.toggle('ending', s.running && rem <= 2000);

  const btn = $('#play-btn');
  const mode = s.running ? 'pause' : 'play';
  if (force || btn.dataset.mode !== mode) {
    btn.dataset.mode = mode;
    btn.innerHTML = s.running ? ICON.pause : ICON.play;
    btn.setAttribute('aria-label', s.running ? 'Пауза (Пробел)' : 'Старт (Пробел)');
    $('#step-hint').textContent = stepHint(s, TEA_BY_ID[s.teaId]);
  }
  updateTitle();
}

function updateTitle() {
  const s = state.session;
  if (s && s.running) {
    const step = curStep();
    const label = step.kind === 'steep' ? `Пролив ${step.n}` : step.kind === 'rinse' ? 'Промывка' : 'Прогрев';
    document.title = `${fmtClock(s.remainingMs)} · ${label} — 茶道`;
  } else {
    document.title = '茶道 ChaDao';
  }
}

const LOG_PERIODS = [['all', 'За всё время'], ['7', 'Последние 7 дней'], ['30', 'Последние 30 дней'], ['90', 'Последние 90 дней'], ['year', 'Этот год'], ['custom', 'Свой период…']];
const LOG_RATINGS = [['', 'Любая оценка'], ['5', '5 пиал'], ['4+', '4 и выше'], ['3+', '3 и выше'], ['1-2', '1–2 пиалы'], ['0', 'Без оценки']];
const emptyLogFilter = () => ({ tea: '', rating: '', period: 'all', from: '', to: '' });
const logFilterActive = f => !!(f.tea || f.rating || f.period !== 'all');

/** [от, до] в миллисекундах; границы своего периода включают целые локальные сутки */
function logPeriodRange(f) {
  if (f.period === 'custom') {
    let from = f.from ? new Date(f.from + 'T00:00:00').getTime() : -Infinity;
    let to = f.to ? new Date(f.to + 'T23:59:59.999').getTime() : Infinity;
    if (from > to) [from, to] = [new Date(f.to + 'T00:00:00').getTime(), new Date(f.from + 'T23:59:59.999').getTime()];
    return [from, to];
  }
  if (f.period === 'year') return [new Date(new Date().getFullYear(), 0, 1).getTime(), Infinity];
  const n = Number(f.period);
  return n ? [Date.now() - n * 86400000, Infinity] : [-Infinity, Infinity];
}

function matchesRating(r, f) {
  switch (f) {
    case '5': return r === 5;
    case '4+': return r >= 4;
    case '3+': return r >= 3;
    case '1-2': return r >= 1 && r <= 2;
    case '0': return !r;
    default: return true;
  }
}

function filteredLog() {
  const f = state.logFilter, [from, to] = logPeriodRange(f);
  const byDate = from !== -Infinity || to !== Infinity;
  return state.log.filter(e => {
    if (f.tea && e.teaId !== f.tea) return false;
    if (!matchesRating(e.rating || 0, f.rating)) return false;
    if (byDate) { const t = Date.parse(e.date); if (!(t >= from && t <= to)) return false; }
    return true;
  });
}

const fmtVolume = ml => ml >= 1000 ? `${(ml / 1000).toFixed(1)} л` : `${Math.round(ml)} мл`;
const byDateDesc = (a, b) => (Date.parse(b.date) || 0) - (Date.parse(a.date) || 0);

function logStats(list) {
  const rated = list.filter(e => e.rating >= 1 && e.rating <= 5);
  const byTea = new Map();
  for (const e of list) {
    const o = byTea.get(e.teaId) || { name: splitParen(e.teaName)[0], cat: e.categoryId, count: 0, sum: 0, rated: 0 };
    o.count++;
    if (e.rating) { o.sum += e.rating; o.rated++; }
    byTea.set(e.teaId, o);
  }
  const mean = o => o.rated ? o.sum / o.rated : 0;
  return {
    count: list.length,
    steeps: list.reduce((a, e) => a + (e.steepsDone || 0), 0),
    grams: list.reduce((a, e) => a + e.grams, 0),
    waterMl: list.reduce((a, e) => a + e.volume * (e.steepsDone || 0), 0),
    avg: rated.length ? rated.reduce((a, e) => a + e.rating, 0) / rated.length : null,
    top: [...byTea.values()].sort((a, b) => b.count - a.count || mean(b) - mean(a)).slice(0, 5),
    series: rated.slice().sort((a, b) => -byDateDesc(a, b)).slice(-30)
  };
}

function dynamicsHTML(series) {
  if (series.length < 2) return '<p class="text-sm text-sage mt-3">Нужно как минимум две оценённые церемонии, чтобы построить график.</p>';
  const W = 320, H = 132, L = 20, R = 8, T = 10, B = 22;
  const x = i => L + i * (W - L - R) / (series.length - 1);
  const y = r => T + (5 - r) * (H - T - B) / 4;
  const ma = series.map((_, i) => { const w = series.slice(Math.max(0, i - 2), i + 1); return w.reduce((a, e) => a + e.rating, 0) / w.length; });
  const pts = arr => arr.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const day = e => new Date(e.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
  const mean = a => a.reduce((s, e) => s + e.rating, 0) / a.length;
  let trend = '';
  if (series.length >= 6) {
    const recent = mean(series.slice(-5)), before = mean(series.slice(0, -5)), d = recent - before;
    trend = `<p class="text-[13px] text-sage mt-2">Последние 5: <b class="mono text-ink">${recent.toFixed(1)}</b> · раньше: <span class="mono">${before.toFixed(1)}</span> ` +
            (Math.abs(d) >= 0.05 ? `<span class="mono ${d > 0 ? 'trend-up' : 'trend-down'}">${d > 0 ? '▲ +' : '▼ −'}${Math.abs(d).toFixed(1)}</span>` : '<span class="mono">без изменений</span>') + '</p>';
  }
  return `<div class="dyn">
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="График оценок: ${series.length} последних оценённых церемоний, от ${series[0].rating} до ${series[series.length - 1].rating} пиал">
      ${[1, 2, 3, 4, 5].map(r => `<line class="ch-grid" x1="${L}" x2="${W - R}" y1="${y(r)}" y2="${y(r)}"/><text class="ch-lbl" x="${L - 6}" y="${y(r) + 3}" text-anchor="end">${r}</text>`).join('')}
      <polyline class="ch-raw" points="${pts(series.map(e => e.rating))}"/>
      <polyline class="ch-ma" points="${pts(ma)}"/>
      ${series.map((e, i) => `<circle class="ch-dot" cx="${x(i).toFixed(1)}" cy="${y(e.rating).toFixed(1)}" r="3"><title>${day(e)} · ${e.rating} из 5</title></circle>`).join('')}
      <text class="ch-lbl" x="${L}" y="${H - 6}">${day(series[0])}</text>
      <text class="ch-lbl" x="${W - R}" y="${H - 6}" text-anchor="end">${day(series[series.length - 1])}</text>
    </svg>
    <p class="stat-note">Точки — оценки, линия — скользящее среднее по трём последним.</p>
    ${trend}
  </div>`;
}

function statsHTML(st) {
  const max = st.top.length ? st.top[0].count : 1;
  const tile = (k, v, cls = '', title = '') => `<div class="stat ${cls}" ${title ? `title="${title}"` : ''}><div class="k">${k}</div><div class="v text-lg">${v}</div></div>`;
  return `

      ${tile('Выпито ≈', fmtVolume(st.waterMl), '', 'Ориентировочно: объём посуды × число проливов')}
      ${tile('Чая заварено', st.grams.toFixed(1) + ' г')}
      ${tile('Средняя оценка', st.avg == null ? '—' : st.avg.toFixed(1), 'wide')}
    </div>
    <p class="stat-note">«Выпито» — оценка по объёму посуды и числу проливов.</p>
    <div class="stat-panels">

        <ol class="top-list">

            <div class="top-head"><span class="top-name">${escapeHtml(o.name)}</span><span class="top-num mono">${o.count}×${o.rated ? ` · ★ ${(o.sum / o.rated).toFixed(1)}` : ''}</span></div>
            <div class="top-bar"><span style="width:${Math.max(6, Math.round(o.count / max * 100))}%; background:${(CAT[o.cat] || {}).color || 'var(--accent)'}"></span></div>
          </li>`).join('')}
        </ol>
      </section>
      <section class="stat-panel" aria-label="Динамика оценок">
        <h4 class="section-label">Динамика оценок</h4>

      </section>
    </div>`;
}

}

function renderLogBody() {
  const body = $('#log-body');

  $('#lf-reset').hidden = !active;
  $('#lf-dates').hidden = f.period !== 'custom';

  body.innerHTML = `
    <h3 class="section-label mt-6">Статистика${active ? ' · по выбранным записям' : ''}</h3>

function onLogFilterChange(el) {
  const f = state.logFilter;
  if (el.id === 'lf-tea') f.tea = el.value;
  else if (el.id === 'lf-rating') f.rating = el.value;
  else if (el.id === 'lf-period') { f.period = el.value; if (f.period !== 'custom') { f.from = ''; f.to = ''; } }

function resetLogFilter() {
  state.logFilter = emptyLogFilter();

      <div class="mono text-[11px] text-dim mt-1 truncate" title="Кривая: ${e.steepTimes.join(' · ')} с">кривая: ${e.steepTimes.map(fmtSec).join(' · ')}</div>

function deleteLogEntry(id) {
  if (!confirm('Удалить эту запись из дневника?')) return;
  state.log = state.log.filter(e => e.id !== id);
  store.set(KEYS.log, state.log);
  renderLog();
  toast('Запись удалена');
}

function repeatLogEntry(id) {
  const e = state.log.find(x => x.id === id);
  const tea = e && TEA_BY_ID[e.teaId];
  if (!tea) return;
  state.volume = clampVolume(e.volume);

}

const stripParens = s => String(s || '').replace(/[()]/g, '').trim();

function openTeaEditor(id, catId) {

  if (id && !base) return;

  const [nm, sb] = splitParen(t.name_ru);

    return `<div class="fld"><label for="te-${key}">${label}</label>

  state.modal = { type: 'tea' };
  $('#modal-root').innerHTML = `
    <div class="modal-wrap">

            ${text('subtitle', 'Подзаголовок', sb, 'Урожай, происхождение')}
            <div class="fld"><label for="te-categoryId">Категория</label>
              <select id="te-categoryId" name="categoryId" class="field">${CATEGORIES.map(c => `<option value="${c.id}" ${c.id === t.categoryId ? 'selected' : ''}>${c.short}</option>`).join('')}</select></div>
            ${text('hanzi', 'Иероглифы', hz, '铁观音')}
            ${text('pinyin', 'Пиньинь', py, 'Tiě Guānyīn')}
          </div>` : ''}

          <div class="form-grid">
            ${num('temp_c', 'Температура от', '°C', 1, t.temp_c)}
            <div class="fld"><label for="te-temp_max">до (необязательно)</label>
              <div class="fld-row"><input id="te-temp_max" name="temp_max" type="number" min="60" max="100" step="1" inputmode="numeric" value="${t.temp_max || ''}" class="field mono"><span class="fld-unit">°C</span></div></div>
            ${num('grams_per_100ml', 'Граммовка', 'г / 100 мл', '0.1', t.grams_per_100ml)}
            ${num('warm_breath_sec', 'Прогрев', 'с', 1, t.warm_breath_sec)}
            <div class="fld col-span-2">
              <label class="check"><input type="checkbox" name="needs_rinse" ${t.needs_rinse ? 'checked' : ''}><span>Нужна промывка листа</span></label>

function parseSteepList(str) {
  const parts = String(str).split(/[;,\s]+/).filter(Boolean);
  const nums = parts.map(p => (/^\d+$/.test(p) ? Number(p) : NaN));
  return { parts, nums, ok: parts.length > 0 && nums.every(n => n >= LIMITS.steep_sec[0] && n <= LIMITS.steep_sec[1]) && parts.length <= LIMITS.steep_count[1] };
}

function updateTeaPreview() {
  const form = $('#tea-form');
  if (!form) return;
  const r = parseSteepList(form.elements.steep_times.value);
  $('#te-preview').textContent = r.ok
    ? `Проливов: ${r.nums.length} · ${fmtDuration(r.nums.reduce((a, b) => a + b, 0))} на настои`
    : '';
}

function saveTeaForm(form) {
  const id = form.dataset.id;
  const base = id ? TEA_BY_ID[id] : null;
  const isCustom = !base || base.custom;
  const f = form.elements;
  const fail = (msg, el) => { $('#tea-error').textContent = msg; if (el) el.focus(); };
  const rinseOn = f.needs_rinse.checked;

  const fields = {};
  for (const key of ['temp_c', 'grams_per_100ml', 'warm_breath_sec', 'rinse_sec']) {
    if (key === 'rinse_sec' && !rinseOn) continue;
    const [lo, hi] = LIMITS[key];
    const str = String(f[key].value).trim().replace(',', '.');
    const v = Number(str);
    if (str === '' || !Number.isFinite(v) || v < lo || v > hi) return fail(`${FIELD_LABELS[key]}: введите число от ${lo} до ${hi}`, f[key]);
    fields[key] = key === 'grams_per_100ml' ? Math.round(v * 10) / 10 : Math.round(v);
  }
  const tmStr = String(f.temp_max.value).trim();
  if (tmStr === '') fields.temp_max = null;
  else {
    const tm = Number(tmStr), [lo, hi] = LIMITS.temp_max;
    if (!Number.isFinite(tm) || tm < lo || tm > hi) return fail(`${FIELD_LABELS.temp_max}: введите число от ${lo} до ${hi}`, f.temp_max);
    if (tm < fields.temp_c) return fail('Температура «до» не может быть ниже температуры «от»', f.temp_max);
    fields.temp_max = tm > fields.temp_c ? Math.round(tm) : null;
  }
  const steeps = parseSteepList(f.steep_times.value);
  if (!steeps.ok) return fail(`Время проливов: от 1 до ${LIMITS.steep_count[1]} целых чисел (секунды, ${LIMITS.steep_sec[0]}–${LIMITS.steep_sec[1]}) через запятую`, f.steep_times);
  fields.steep_times = steeps.nums;
  fields.max_steeps = steeps.nums.length;
  fields.needs_rinse = rinseOn;
  fields.open_lid_warning = f.open_lid_warning.checked;
  fields.flavor_tags = f.flavor_tags.value.split(/[,;]+/).map(s => s.trim()).filter(Boolean).slice(0, 8);
  fields.brewing_tip = f.brewing_tip.value.trim();

  const hadSession = !!(state.session && state.session.teaId === id);
  let selectId = id;

  if (isCustom) {
    const name = stripParens(f.name.value);
    if (!name) return fail('Введите название сорта', f.name);
    const sub = stripParens(f.subtitle.value), hz = stripParens(f.hanzi.value), py = stripParens(f.pinyin.value);
    const cand = {
      ...fields,
      id: id || 'custom-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      name_ru: sub ? `${name} (${sub})` : name,
      name_cn: hz && py ? `${hz} (${py})` : hz || (py ? ` (${py})` : ''),
      categoryId: f.categoryId.value
    };
    if (!fields.needs_rinse && base) cand.rinse_sec = base.rinse_sec;
    const tea = normalizeCustom(cand);
    if (!tea) return fail('Не удалось сохранить сорт — проверьте поля', f.name);
    const i = customTeas.findIndex(x => x.id === tea.id);
    if (i >= 0) customTeas[i] = tea; else customTeas.push(tea);
    saveCustomTeas();
    selectId = tea.id;
    state.category = tea.categoryId;
  } else {
    const orig = TEA_DATABASE.find(x => x.id === id);
    const diff = {};
    for (const [k, v] of Object.entries(fields)) {
      const nz = x => (x === undefined ? null : x);
      if (JSON.stringify(nz(v)) !== JSON.stringify(nz(orig[k]))) diff[k] = v;
    }
    if (Object.keys(diff).length) overrides[id] = diff; else delete overrides[id];
    saveOverrides();
  }

  rebuildTeas();
  closeModal();
  state.selectedId = selectId;
  saveSettings();
  if (isCustom) {
    state.query = '';
    $('#search').value = '';
  }
  renderCatalog();
  renderDetail();
  if (isCustom && window.innerWidth < 1024) openSheet();
  toast(hadSession ? 'Сохранено. Текущая церемония идёт по прежним параметрам' : isCustom ? 'Сорт сохранён' : 'Параметры сорта сохранены');
}

function resetTeaOverrides(id) {
  if (!overrides[id]) return;
  delete overrides[id];
  saveOverrides();
  rebuildTeas();
  closeModal();
  renderCatalog();
  renderDetail();
  toast('Параметры возвращены к стандартным');
}

function deleteCustomTea(id) {
  const t = TEA_BY_ID[id];
  if (!t || !t.custom) return;
  if (state.session && state.session.teaId === id) { toast('Сначала завершите текущую церемонию с этим сортом'); return; }
  if (!confirm(`Удалить сорт «${splitParen(t.name_ru)[0]}»? Записи в дневнике сохранятся.`)) return;
  customTeas = customTeas.filter(x => x.id !== id);
  saveCustomTeas();
  favorites = favorites.filter(x => x !== id);
  saveFavorites();
  rebuildTeas();
  closeModal();
  if (state.selectedId === id) state.selectedId = (TEAS.find(x => x.categoryId === t.categoryId) || TEAS[0]).id;
  saveSettings();
  renderCatalog();
  renderDetail();
  closeSheet();
  toast('Сорт удалён');
}

/* ════════════════════════════════════════════════════════════════════
   11. НАВИГАЦИЯ
   ════════════════════════════════════════════════════════════════════ */
function showScreen(name) {
  state.screen = name;
  ['setup', 'session', 'log'].forEach(n => {
    const el = $(`#screen-${n}`);
    el.hidden = n !== name;
    if (n === name) { el.classList.remove('screen-in'); void el.offsetWidth; el.classList.add('screen-in'); }
  });
  $$('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.tab === name)));
  if (name !== 'setup') closeSheet();
  if (name === 'session') renderSession();
  if (name === 'log') { state.logLimit = LOG_PAGE; renderLog(); }
  if (name === 'setup') renderDetail();
  window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  updateNav();
  syncHistory();
}

/* ── История браузера: «Назад» ведёт на предыдущий экран сайта, а не уводит с него ──
   В истории хранятся только экран и открытая категория. Шторка деталей и окна закрываются кнопкой «Назад»,
   не меняя экран. Под стартовым видом лежит служебная запись (base), чтобы «Назад» можно было перехватить. */
const viewKey = v => `${v.screen}|${v.category}`;
const currentView = () => ({ screen: state.screen, category: state.category });
const viewHash = v => '#' + (v.screen === 'setup' ? (v.category !== 'all' ? 'cat-' + v.category : '') : v.screen);
const viewUrl = v => (viewHash(v) === '#' ? location.pathname + location.search : viewHash(v));
let historyReady = false, restoringView = false, skipPops = 0;

function syncHistory() {
  if (!historyReady || restoringView) return;
  const v = currentView(), cur = history.state;
  if (cur && !cur.base && viewKey(cur) === viewKey(v)) return;
  try { history.pushState(v, '', viewUrl(v)); } catch { /* file:// и т. п. */ }
}

const overlaysOpen = () => !!state.modal || $('#detail').classList.contains('open');
function closeOverlays() {
  if (state.modal) closeModal();
  if ($('#detail').classList.contains('open')) closeSheet();
}

function applyView(v) {
  let screen = ['setup', 'session', 'log'].includes(v.screen) ? v.screen : 'setup';
  if (screen === 'session' && !state.session) screen = 'setup';
  state.category = CAT[v.category] ? v.category : 'all';
  showScreen(screen);
  if (screen === 'setup') renderCatalog();
}

window.addEventListener('popstate', e => {
  if (skipPops > 0) { skipPops--; return; }
  if (overlaysOpen()) {                       // «Назад» сначала закрывает шторку/окно и остаётся на экране
    closeOverlays();
    skipPops = 1;
    setTimeout(() => { skipPops = 0; }, 500);
    history.forward();
    return;
  }
  const st = e.state;
  if (!st) return;
  restoringView = true;
  try { applyView(st); } finally { restoringView = false; }
  if (st.base) history.back();                // дошли до самой первой записи — выходим с сайта
});

function initHistory() {
  try {
    const h = location.hash.slice(1);
    if (h.startsWith('cat-') && CAT[h.slice(4)]) { state.category = h.slice(4); renderCatalog(); }
    else if (h === 'log') showScreen('log');
    else if (h === 'session' && state.session) showScreen('session');
    const v = currentView();
    history.replaceState({ ...v, base: true }, '', viewUrl(v));
    history.pushState(v, '', viewUrl(v));
    historyReady = true;
  } catch { /* история недоступна — «Назад» работает как обычно */ }
}

/* Экран не гаснет, пока идёт отсчёт (Screen Wake Lock) */
let wakeSentinel = null, wakePending = false, wakeRetryAt = 0;
function syncWakeLock() {
  if (!('wakeLock' in navigator)) return;
  const want = !!(state.session && state.session.running) && document.visibilityState === 'visible';
  if (want && !wakeSentinel && !wakePending && performance.now() >= wakeRetryAt) {
    wakePending = true;
    navigator.wakeLock.request('screen').then(s => {
      wakePending = false;
      wakeSentinel = s;
      s.addEventListener('release', () => { if (wakeSentinel === s) wakeSentinel = null; });
      if (!(state.session && state.session.running)) { wakeSentinel = null; s.release().catch(() => {}); }
    }).catch(() => { wakePending = false; wakeRetryAt = performance.now() + 5000; });
  } else if (!want && wakeSentinel) {
    const s = wakeSentinel;
    wakeSentinel = null;
    s.release().catch(() => {});
  }
}
document.addEventListener('visibilitychange', syncWakeLock);

function updateNav() {
  const s = state.session;
  const dot = $('#nav-dot'), timer = $('#nav-timer');
  dot.hidden = !s;
  dot.classList.toggle('pulse', !!(s && s.running));
  const showTimer = !!(s && s.running && state.screen !== 'session');
  timer.hidden = !showTimer;
  if (showTimer) timer.textContent = fmtClock(s.remainingMs);
  syncWakeLock();
}

function updateMuteBtn() {
  const b = $('#mute-btn');
  b.innerHTML = sound.muted ? ICON.soundOff : ICON.soundOn;
  b.setAttribute('aria-label', sound.muted ? 'Включить звук' : 'Выключить звук');
  b.title = sound.muted ? 'Звук выключен' : 'Звук включён';
}

/* ════════════════════════════════════════════════════════════════════
   12. СОБЫТИЯ
   ════════════════════════════════════════════════════════════════════ */
document.addEventListener('click', e => {
  if (!e.target.closest('#material-info')) setInfoOpen(false);
  const el = e.target.closest('[data-action]');
  if (!el) return;
  // Кнопки сессии теряют фокус, чтобы пробел не «кликал» их повторно
  if (el.tagName === 'BUTTON' && el.closest('#screen-session')) el.blur();
  const a = el.dataset.action;
  switch (a) {
    case 'tab':
      if (el.dataset.tab === 'session' && !state.session) { toast('Выберите чай и начните церемонию'); }
      showScreen(el.dataset.tab);
      break;
    case 'mute':
      sound.setMuted(!sound.muted);
      store.set(KEYS.muted, sound.muted);
      updateMuteBtn();
      if (!sound.muted) sound.click();
      break;
    case 'preset-vol':     setVolume(el.dataset.val); break;
    case 'material':       setMaterial(el.dataset.val); break;
    case 'open-category':  openCategory(el.dataset.val); break;
    case 'all-categories': showAllCategories(); break;
    case 'toggle-info':    setInfoOpen(!$('#material-info').classList.contains('open')); break;
    case 'toggle-vessel':  state.vesselOpen = !state.vesselOpen; updateVesselUI(); break;
    case 'toggle-fav':     toggleFavorite(el.dataset.id); break;
    case 'toggle-fav-all': state.favExpanded = !state.favExpanded; renderCatalog(); break;
    case 'log-filter-reset': resetLogFilter(); break;
    case 'new-tea':        openTeaEditor(null, el.dataset.cat); break;
    case 'edit-tea':       openTeaEditor(el.dataset.id); break;
    case 'tea-reset':      resetTeaOverrides(el.dataset.id); break;
    case 'tea-delete':     deleteCustomTea(el.dataset.id); break;
    case 'clear-search':
      state.query = '';
      $('#search').value = '';
      renderCatalog();
      $('#search').focus();
      break;
    case 'select-tea':     selectTea(el.dataset.id); break;
    case 'close-sheet':    closeSheet(); break;
    case 'start-ceremony': startSession(TEA_BY_ID[el.dataset.id]); break;
    case 'toggle-timer':   toggleTimer(); break;
    case 'reset-step':     resetStep(); break;
    case 'prev-step':      goToStep(state.session.idx - 1); break;
    case 'next-step':      goToStep(state.session.idx + 1); break;
    case 'goto-step':      goToStep(Number(el.dataset.idx)); break;
    case 'skip-step':      skipStep(); break;
    case 'adjust':         adjustCurve(Number(el.dataset.delta)); break;
    case 'finish-session': openFinishModal(); break;
    case 'rate':           setRating(Number(el.dataset.val)); break;
    case 'modal-save':     saveLogEntry(); break;
    case 'modal-cancel':   closeModal(); break;
    case 'modal-discard':
      if (confirm('Завершить чаепитие без записи в дневник?')) {
        closeModal();
        endSession();
        showScreen('setup');
      }
      break;
    case 'log-delete':     deleteLogEntry(el.dataset.id); break;
    case 'log-repeat':     repeatLogEntry(el.dataset.id); break;
    case 'log-more': { const y = window.scrollY; state.logLimit += LOG_PAGE; renderLogBody(); window.scrollTo({ top: y, behavior: 'instant' }); break; }
  }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'tea-form') { e.preventDefault(); saveTeaForm(e.target); }
});
document.addEventListener('input', e => {
  if (e.target.closest && e.target.closest('#tea-form')) { updateTeaPreview(); $('#tea-error').textContent = ''; }
});
document.addEventListener('change', e => {
  if (e.target.name === 'needs_rinse') { $('#te-rinse_sec').disabled = !e.target.checked; }
  if (e.target.closest && e.target.closest('#tea-form')) updateTeaPreview();
  if (e.target.closest && e.target.closest('#log-filters')) onLogFilterChange(e.target);
});

$('#vol-range').addEventListener('input', e => setVolume(e.target.value));
$('#vol-input').addEventListener('change', e => {
  const raw = e.target.value.trim();
  // Пустое или нечисловое значение не сбрасывает объём — возвращаем текущий
  if (raw === '' || !Number.isFinite(Number(raw))) { e.target.value = state.volume; return; }
  setVolume(raw);
  e.target.value = state.volume;
});
$('#vol-input').addEventListener('keydown', e => { if (e.key === 'Enter') e.target.blur(); });
$('#search').addEventListener('input', e => { state.query = e.target.value; renderCatalog(); });

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (state.modal) { closeModal(); return; }
    if ($('#material-info').classList.contains('open')) { setInfoOpen(false); $('#material-info .info-btn').focus(); return; }
    if ($('#detail').classList.contains('open')) { closeSheet(); return; }
  }
  // Горячие клавиши не срабатывают в полях ввода (поиск, заметка, объём)
  if (isTypingTarget(e.target)) return;
  if (state.modal || state.screen !== 'session' || !state.session) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  switch (e.code) {
    case 'Space':      e.preventDefault(); if (!e.repeat) toggleTimer(); break;
    case 'KeyR':       e.preventDefault(); resetStep(); break;
    case 'ArrowLeft':  e.preventDefault(); goToStep(state.session.idx - 1); break;
    case 'ArrowRight': e.preventDefault(); goToStep(state.session.idx + 1); break;
  }
});

window.addEventListener('resize', () => { if (window.innerWidth >= 1024) closeSheet(); });

/* ════════════════════════════════════════════════════════════════════
   13. ЗАПУСК
   ════════════════════════════════════════════════════════════════════ */
initSetupStatic();
restoreSession();
updateVesselUI();
renderCatalog();
renderDetail();
updateMuteBtn();
updateNav();
initHistory();
setInterval(tick, 50);
/* Офлайн-режим: service worker кэширует приложение, шрифты и стили */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}

</script>
